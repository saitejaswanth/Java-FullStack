<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Java from Zero — Animated Beginner Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FA;--paper:#FFFFFF;--ink:#1A2433;--muted:#566378;--line:#D3DCE7;--soft:#E9EFF6;
  --blue:#2A6FB0;--blue-soft:#E1ECF8;--orange:#D96500;--orange-soft:#FDEBD9;--green:#1F8A55;--green-soft:#DDF2E6;
  --red:#D23B4A;--red-soft:#FBE2E5;--purple:#6A4FD8;--purple-soft:#ECE8FD;--amber:#E9A100;--amber-soft:#FFF3D1;
  --code-bg:#132033;--code-ink:#E4ECF6;--code-dim:#7F8FA8;
  --sans:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1522;--paper:#152032;--ink:#E6EDF7;--muted:#9DABC2;--line:#2B3A52;--soft:#1B2940;
  --blue:#5B9BE0;--blue-soft:#16304F;--orange:#FF8B2B;--orange-soft:#3A2614;--green:#45C07F;--green-soft:#133524;
  --red:#F26473;--red-soft:#3F1C24;--purple:#9C87FF;--purple-soft:#28224D;--amber:#F4B72A;--amber-soft:#3A3219;--code-bg:#0A121F;}}
:root[data-theme="dark"]{
  --bg:#0D1522;--paper:#152032;--ink:#E6EDF7;--muted:#9DABC2;--line:#2B3A52;--soft:#1B2940;
  --blue:#5B9BE0;--blue-soft:#16304F;--orange:#FF8B2B;--orange-soft:#3A2614;--green:#45C07F;--green-soft:#133524;
  --red:#F26473;--red-soft:#3F1C24;--purple:#9C87FF;--purple-soft:#28224D;--amber:#F4B72A;--amber-soft:#3A3219;--code-bg:#0A121F;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
code,.mono{font-family:var(--mono);font-size:.9em}
p code,li code,td code,.note code{background:var(--soft);padding:1px 6px;border-radius:5px}
b,strong{font-weight:700}
a{color:var(--blue)}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:60px;padding:0 20px;background:var(--paper);border-bottom:1.5px solid var(--line)}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;white-space:nowrap}
.cup{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--orange);color:#fff;font-size:18px;position:relative}
.cup::before,.cup::after{content:"";position:absolute;top:-9px;width:3px;height:8px;border-radius:2px;background:var(--orange);opacity:.6;animation:steam 2.2s ease-in-out infinite}
.cup::before{left:12px}.cup::after{left:19px;animation-delay:.6s}
@keyframes steam{0%{transform:translateY(4px);opacity:0}50%{opacity:.7}100%{transform:translateY(-6px);opacity:0}}
.topbar .grow{flex:1}
.progress-pill{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-weight:700}
.progress-pill .bar{width:140px;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.progress-pill .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .6s}
.iconbtn{border:0;background:var(--soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}
.menu-btn{display:none}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr)}
.side{position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;padding:18px 14px 40px;border-right:1.5px solid var(--line);background:var(--paper)}
.side h3{font-size:13px;color:var(--muted);margin:6px 10px 10px;font-weight:700}
.lesson-link{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:10px;cursor:pointer;font-size:15.5px;line-height:1.3}
.lesson-link .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font:700 13px var(--mono);color:var(--muted);transition:.3s}
.lesson-link:hover{background:var(--soft)}
.lesson-link.on{background:var(--blue-soft);font-weight:700}
.lesson-link.on .num{background:var(--blue);color:#fff}
.lesson-link.done .num{background:var(--green);color:#fff}
.lesson-link .tick{color:var(--green);font-weight:700;font-size:14px}
main{min-width:0;padding:34px 44px 90px}
.lesson{max-width:1180px;margin:0 auto}

/* ---------- lesson typography ---------- */
.l-head{margin-bottom:26px}
.l-head .kicker{font-weight:700;color:var(--orange);font-size:15px}
.l-head h1{font-size:44px;line-height:1.1;margin:6px 0 10px;letter-spacing:-.01em}
.l-head .sum{font-size:20px;color:var(--muted);max-width:68ch;margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--soft);color:var(--muted)}
section.blk{margin:38px 0}
section.blk>h2{font-size:28px;line-height:1.2;margin:0 0 6px}
section.blk>.intro{color:var(--muted);margin:0 0 16px;max-width:72ch}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:20px 22px}
.card h3{margin:0 0 8px;font-size:20px}
.card p{margin:0 0 10px}
.card p:last-child{margin-bottom:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
ul.clean{margin:0;padding-left:20px}
ul.clean li{margin:4px 0}
.note{border-radius:14px;padding:14px 18px;margin:16px 0;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.note .ic{font-size:20px;line-height:1.3}
.note.tip{background:var(--blue-soft)}.note.warn{background:var(--amber-soft)}.note.bad{background:var(--red-soft)}.note.good{background:var(--green-soft)}
table.t{width:100%;border-collapse:separate;border-spacing:0;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;font-size:16px}
table.t th{text-align:left;background:var(--soft);padding:10px 14px;font-size:14.5px}
table.t td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}
.layer{margin-top:14px}
.layer>summary{cursor:pointer;font-weight:700;color:var(--blue);list-style:none;display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:10px;background:var(--blue-soft)}
.layer>summary::-webkit-details-marker{display:none}
.layer>summary::before{content:"+";font:700 16px var(--mono);transition:transform .25s}
.layer[open]>summary::before{content:"−"}
.layer>.inner{padding:14px 2px 0;animation:fadeup .35s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- code ---------- */
pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:14px 0;font:14.5px/1.65 var(--mono);overflow-x:auto}
pre.code .ln{display:block;padding:0 18px;white-space:pre;min-height:1.65em}
.k{color:#C9A7FF}.s{color:#9EE2B3}.c{color:#7F8FA8;font-style:italic}.n{color:#FFCF70}.ty{color:#7FD1FF}.an{color:#FF9E64}
.hlline{background:rgba(244,183,42,.22);box-shadow:inset 4px 0 #F4B72A}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:11px;padding:11px 18px;font:700 15.5px var(--sans);cursor:pointer;background:var(--blue);color:#fff;transition:transform .12s,filter .15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.96)}
.btn.orange{background:var(--orange)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.purple{background:var(--purple)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.inp,select.inp{font:600 16px var(--mono);padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);min-width:0}
input[type=range]{accent-color:var(--blue);width:100%}

/* ---------- animation utils ---------- */
.pop{animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.flash{animation:flash 1s}
@keyframes flash{0%{background:var(--amber-soft);box-shadow:0 0 0 4px var(--amber-soft)}100%{}}
.fadeup{animation:fadeup .45s ease both}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ---------- visualizer ---------- */
.viz{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.viz-tabs{display:flex;gap:6px;padding:12px 14px 0;flex-wrap:wrap}
.viz-tabs button{border:0;background:var(--soft);color:var(--muted);font:700 14px var(--sans);padding:8px 14px;border-radius:10px;cursor:pointer}
.viz-tabs button.on{background:var(--ink);color:var(--bg)}
.viz-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1.5px solid var(--line)}
.viz-bar .btn{padding:9px 14px;font-size:15px}
.viz-bar .count{margin-left:auto;font:700 14px var(--mono);color:var(--muted)}
.viz-bar select{font:700 14px var(--sans);padding:8px;border-radius:9px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.viz-prog{height:5px;background:var(--soft)}
.viz-prog i{display:block;height:100%;width:0;background:var(--orange);transition:width .35s}
.explain{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:14px 18px;background:var(--amber-soft);min-height:74px;border-bottom:1.5px solid var(--line)}
.explain .lb{font:700 13px var(--mono);background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:8px;white-space:nowrap;margin-top:2px}
.explain p{margin:0;font-size:17px;line-height:1.5}
.explain.exc{background:var(--red-soft)}
.explain.fin{background:var(--green-soft)}
.explain.crash{background:var(--red-soft)}
.viz-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,.8fr) minmax(0,.85fr);grid-template-areas:"code stack heap" "code out out";gap:14px;padding:14px}
.vcode{grid-area:code;background:var(--code-bg);border-radius:14px;padding:12px 0;overflow:auto;align-self:start}
.vcode .cl{display:grid;grid-template-columns:38px 1fr;align-items:center;font:13px/1.75 var(--mono);color:var(--code-ink);position:relative;transition:background .25s}
.vcode .cl .no{text-align:right;padding-right:12px;color:var(--code-dim);font-size:12.5px;user-select:none;position:relative}
.vcode .cl .src{white-space:pre;padding-right:14px}
.vcode .cl.visited .no::after{content:"";position:absolute;right:3px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#4F7FB8}
.vcode .cl.cur{background:rgba(244,183,42,.2);box-shadow:inset 4px 0 #F4B72A}
.vcode .cl.cur .no{color:#F4B72A;font-weight:700}
.vcode .cl.cur .no::before{content:"▶";position:absolute;left:4px;color:#F4B72A;font-size:11px;animation:nudge .8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
.vcode .cl.skip .src{text-decoration:line-through;text-decoration-color:#F26473;opacity:.55}
.ev{grid-column:2;justify-self:start;margin:2px 14px 6px 0;font:600 13px/1.4 var(--mono);background:#F4B72A;color:#231a00;padding:4px 10px;border-radius:8px;white-space:normal;animation:evin .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes evin{from{opacity:0;transform:translateY(-6px) scale(.9)}to{opacity:1;transform:none}}
.mem{background:var(--bg);border-radius:14px;padding:12px;min-height:120px}
.mem h4{margin:0 0 10px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.mem h4 i{font-style:normal;width:10px;height:10px;border-radius:3px}
.vstack{grid-area:stack}.vheap{grid-area:heap}.vout{grid-area:out}
.frames{display:flex;flex-direction:column;gap:10px}
.frame{background:var(--paper);border:2px solid var(--line);border-radius:12px;overflow:hidden;transition:opacity .3s,border-color .3s}
.frame.top{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.frame:not(.top){opacity:.62}
.frame.enter{animation:fenter .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes fenter{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:none}}
.fh{display:flex;justify-content:space-between;align-items:center;font:700 13.5px var(--mono);padding:6px 10px;background:var(--blue-soft);color:var(--blue)}
.fh small{font:700 11px var(--sans);color:var(--muted)}
.vars{padding:6px 8px;display:grid;gap:5px}
.var{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font:13.5px var(--mono)}
.var .vn{font-weight:700}
.var .vt{font-size:11.5px;color:var(--muted);justify-self:end}
.var .vv{min-width:52px;text-align:center;padding:3px 8px;border-radius:7px;background:var(--soft);font-weight:700;transition:background .3s}
.var .vv.ref{background:var(--orange-soft);color:var(--orange)}
.var .vv.unset{color:var(--muted);font-weight:400}
.var .vv.pending,.cell.pending b,.fld .fv.pending{opacity:.15}
.var .lock{font-size:12px}
.empty{color:var(--muted);font-size:14px;font-style:italic;padding:6px 2px}
.heap{display:flex;flex-direction:column;gap:10px}
.obj{background:var(--paper);border:2px solid var(--orange);border-radius:12px;overflow:hidden}
.obj.enter{animation:fenter .5s cubic-bezier(.2,1.2,.4,1)}
.obj .oh{display:flex;justify-content:space-between;align-items:center;font:700 13.5px var(--mono);padding:6px 10px;background:var(--orange-soft);color:var(--orange)}
.obj .oh small{font-weight:600;color:var(--muted);font-size:11.5px}
.obj.exc{border-color:var(--red)}.obj.exc .oh{background:var(--red-soft);color:var(--red)}
.fld{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;padding:4px 10px;font:13.5px var(--mono)}
.fld .fv{justify-self:end;padding:2px 8px;border-radius:7px;background:var(--soft);font-weight:700}
.fld .fv.ref{background:var(--orange-soft);color:var(--orange)}
.cells{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px 10px}
.cell{display:grid;justify-items:center;gap:1px}
.cell b{min-width:44px;text-align:center;padding:6px 6px;border-radius:7px;background:var(--soft);font:700 14px var(--mono);border:2px solid transparent;transition:.3s}
.cell i{font:600 11px var(--mono);color:var(--muted);font-style:normal}
.cell.hi b{border-color:var(--amber);background:var(--amber-soft);transform:translateY(-3px)}
.cell b.ref{color:var(--orange);background:var(--orange-soft)}
.console{background:#0B1320;border-radius:10px;padding:10px 12px;font:13.5px/1.6 var(--mono);color:#D7E3F4;min-height:70px}
.console .o{white-space:pre-wrap;word-break:break-word}
.console .o.err{color:#FF8A96}
.console .o.new{animation:typein .5s steps(20)}
@keyframes typein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.console .caret{display:inline-block;width:8px;height:15px;background:#D7E3F4;vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.arrows path{fill:none;stroke:var(--orange);stroke-width:2.2;opacity:.85}
.token{position:fixed;left:0;top:0;z-index:50;pointer-events:none;font:700 13px var(--mono);padding:4px 10px;border-radius:999px;background:var(--orange);color:#fff;box-shadow:0 6px 18px rgba(217,101,0,.35);white-space:nowrap}
.token.err{background:var(--red);box-shadow:0 6px 18px rgba(210,59,74,.4)}
.token.out{background:var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:0 16px 14px;font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- quiz ---------- */
.quiz .q{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.quiz .q p{margin:0 0 10px;font-weight:700}
.quiz .opts{display:flex;flex-wrap:wrap;gap:8px}
.quiz .opts button{border:0;background:var(--soft);color:var(--ink);font:700 15px var(--sans);padding:9px 14px;border-radius:10px;cursor:pointer;transition:.2s}
.quiz .opts button:hover{filter:brightness(.97)}
.quiz .opts button.right{background:var(--green);color:#fff}
.quiz .opts button.wrong{background:var(--red);color:#fff}
.quiz .why{margin-top:10px;font-size:15.5px;color:var(--muted);display:none}
.quiz .q.answered .why{display:block;animation:fadeup .3s}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:24px;border-top:1.5px solid var(--line)}

/* ---------- widgets (shared) ---------- */
.stage{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:18px;overflow:hidden}
.cap{text-align:center;font-weight:700;min-height:28px;margin-top:8px}
.anat{font:15.5px/2.2 var(--mono);background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:16px 18px;overflow-x:auto;white-space:pre}
.anat .tk{cursor:pointer;border-radius:6px;padding:2px 3px;border-bottom:2px dashed rgba(244,183,42,.6);transition:.2s}
.anat .tk:hover,.anat .tk.on{background:#F4B72A;color:#231a00;border-bottom-color:transparent}
.anat-tip{margin-top:10px;padding:12px 16px;border-radius:12px;background:var(--amber-soft);min-height:52px;font-size:16.5px}

@media (max-width:1100px){
  .viz-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"code code" "stack heap" "out out"}
}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:60px;bottom:0;width:290px;z-index:40;transform:translateX(-102%);transition:transform .3s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:24px 16px 80px}
  .l-head h1{font-size:34px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .progress-pill .bar{width:70px}
}
@media (max-width:640px){
  .viz-grid{grid-template-columns:1fr;grid-template-areas:"code" "stack" "heap" "out"}
  .progress-pill{display:none}
  .iconbtn{white-space:nowrap}
  .topbar{padding:0 12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
/* ---------- lesson widgets ---------- */
.small{font-size:14.5px}
.pipe svg{width:100%;height:auto;display:block}
.pipe .box{fill:var(--paper);stroke-width:3}
.pipe .bt{font:700 17px var(--sans);fill:var(--ink);text-anchor:middle}
.pipe .bs{font:600 13px var(--mono);fill:var(--muted);text-anchor:middle}
.pipe .wire{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round}
.nest{border-radius:16px;padding:14px;border:3px solid var(--orange);background:var(--orange-soft)}
.nest .nl{font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nest .nl small{font-weight:400;color:var(--muted)}
.nest .nest{border-color:var(--blue);background:var(--blue-soft);margin-top:10px}
.nest .nest .nest{border-color:var(--green);background:var(--green-soft)}
.nest .tags{display:flex;gap:6px;flex-wrap:wrap}

.nest .nest.grow{animation-delay:.35s}.nest .nest .nest.grow{animation-delay:.7s}
@keyframes grow{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.reasons .card{position:relative;overflow:hidden}
.reasons .em{font-size:40px;display:inline-block;margin-bottom:6px}
.spin{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.15)}}
.wiggle{animation:wiggle 2.5s ease-in-out infinite}@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}

.gc{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center;min-height:190px}
.gc .vars2{display:grid;gap:10px}

.gc .heapbox{position:relative;min-height:170px;border:2px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start}

.gc .broom{position:absolute;font-size:42px;left:-60px;bottom:4px;transition:left 1.4s ease-in-out}
.road{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start}
.stops{position:relative;padding-left:10px}
.stops::before{content:"";position:absolute;left:25px;top:14px;bottom:14px;width:5px;border-radius:3px;background:linear-gradient(var(--green) var(--fill,0%),var(--line) var(--fill,0%));transition:--fill 1s}
.stop{position:relative;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:7px 0;cursor:pointer;color:var(--ink);font-size:15.5px}

.tierkey{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:10px}

.bytes{display:grid;gap:8px}

.fitgame{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}

.opplay{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:700 20px var(--mono)}

.opres{margin-top:14px;font:700 28px var(--mono);color:var(--blue)}
.flow svg{width:100%;height:auto;display:block}

.flow .res{fill:var(--paper);stroke:var(--line);stroke-width:3;transition:.3s}
.flow .res.on{fill:var(--green-soft);stroke:var(--green)}
.flow text{font:700 15px var(--sans);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.flow .edge{fill:none;stroke:var(--line);stroke-width:4}
.flow .yes{font:700 13px var(--sans);fill:var(--green)}.flow .no{font:700 13px var(--sans);fill:var(--red)}
.lamps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.lamp{display:grid;justify-items:center;gap:6px;padding:12px;border-radius:14px;background:var(--soft);font:700 15px var(--mono)}
.lamp .bulb{width:46px;height:46px;border-radius:50%;background:var(--line);transition:.3s}
.lamp.on .bulb{background:var(--amber);box-shadow:0 0 24px 6px rgba(244,183,42,.6)}
.sw{display:flex;gap:10px;align-items:center;font-weight:700}
.tgl{width:54px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer;transition:.3s;padding:0}
.tgl::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.3s}
.tgl.on{background:var(--green)}.tgl.on::after{left:27px}
.loopcyc .parts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.ltrack{position:relative;height:90px;margin:14px 0 0;border-radius:45px;border:5px solid var(--line)}
.ltrack .runner{position:absolute;top:50%;left:0;font-size:34px;transform:translate(-10%,-55%);transition:left .5s linear}
.ltrack .laps{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:700 18px var(--mono);color:var(--blue)}
.stars{font:700 18px/1.4 var(--mono);background:#0B1320;color:#F4B72A;border-radius:12px;padding:14px 18px;min-height:120px;white-space:pre}
.machine{display:grid;grid-template-columns:1fr 200px 1fr;align-items:center;gap:10px;min-height:170px}
.machine .ins{display:grid;gap:10px;justify-items:end}
.machine .ball{font:700 18px var(--mono);background:var(--blue);color:#fff;border-radius:999px;padding:8px 16px;transition:transform .7s cubic-bezier(.5,0,.3,1),opacity .4s}
.machine .box{height:140px;border-radius:18px;background:var(--ink);color:var(--bg);display:grid;place-items:center;text-align:center;font:700 18px var(--mono);position:relative}
.machine .gear{font-size:36px;display:block}
.machine .box.run .gear{animation:spin 1s linear infinite}
.machine .outb{justify-self:start;font:700 26px var(--mono);background:var(--green);color:#fff;border-radius:999px;padding:10px 20px;opacity:0;transform:translateX(-40px);transition:.6s}

.arrx{position:relative;padding-top:40px}
.arrx .cells{display:flex;gap:6px;flex-wrap:wrap}

.arrx .ptr{position:absolute;top:0;font-size:26px;transition:left .45s cubic-bezier(.3,1.4,.5,1)}
.grid2d{display:inline-grid;grid-template-columns:repeat(4,52px);gap:5px}

.grid2d b.r1{background:var(--blue-soft)}.grid2d b.c1{background:var(--purple-soft)}.grid2d b.hit{background:var(--amber);color:#231a00;transform:scale(1.12)}
.blue{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.blueprint{background:repeating-linear-gradient(0deg,transparent 0 19px,rgba(255,255,255,.12) 19px 20px),repeating-linear-gradient(90deg,transparent 0 19px,rgba(255,255,255,.12) 19px 20px),#1D4E89;color:#fff;border-radius:14px;padding:16px;font:14px/1.7 var(--mono)}
.blueprint b{font-size:16px}
.objs{display:flex;flex-wrap:wrap;gap:12px;min-height:150px;align-content:flex-start}
.objs .ob{background:var(--paper);border:2px solid var(--orange);border-radius:12px;padding:10px 14px;font:13.5px/1.6 var(--mono);animation:stamp .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{from{opacity:0;transform:translate(-120px,-20px) scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ptabs button{border:0;border-radius:12px;padding:10px 16px;font:700 15px var(--sans);cursor:pointer;background:var(--soft);color:var(--ink)}
.ptabs button.on{background:var(--purple);color:#fff}
.bubble{display:inline-block;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:6px 12px;font-weight:700;margin-left:8px;animation:pop .45s}
.animal{display:flex;align-items:center;gap:8px;font-size:34px;min-height:56px}
.tree{display:grid;justify-items:center;gap:26px;position:relative}
.tree .lvl{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}

.tree .tn2:hover,.tree .tn2.on{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.tree .tn2.chk{border-style:dashed}
.netscene{position:relative;height:250px}
.netscene .tryb,.netscene .catchb,.netscene .floor{position:absolute;border-radius:14px;display:grid;place-items:center;font:700 16px var(--mono)}
.netscene .tryb{left:6%;top:10px;width:40%;height:70px;background:var(--blue-soft);border:2px solid var(--blue);color:var(--blue)}
.netscene .catchb{left:6%;top:150px;width:40%;height:50px;background:var(--green-soft);border:2px solid var(--green);color:var(--green);transition:opacity .4s}
.netscene .catchb.off{opacity:.15}
.netscene .floor{left:0;right:0;bottom:0;height:24px;border-radius:0;background:repeating-linear-gradient(45deg,var(--red-soft) 0 12px,transparent 12px 24px);color:var(--red);font-size:12px}
.netscene .ball2{position:absolute;left:24%;top:40px;font-size:30px;transition:top .9s cubic-bezier(.5,0,.8,.4),left .9s}
.netscene .msg{position:absolute;right:4%;top:40px;width:44%;font-weight:700;font-size:17px;line-height:1.5}
.socket{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.impls{display:grid;gap:10px}
.impls button{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font:700 15px var(--sans);cursor:pointer;text-align:left;transition:.25s}

.impls button.bad{border-color:var(--red);background:var(--red-soft)}

canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.hero-java{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}

@keyframes steam2{0%{transform:translate(-50%,20px);opacity:0}40%{opacity:.7}100%{transform:translate(-40%,-40px);opacity:0}}
@media (max-width:900px){.road,.blue,.socket,.fitgame,.hero-java,.gc{grid-template-columns:1fr}.brow{grid-template-columns:70px 1fr}.brow .rg{grid-column:1/-1}.machine{grid-template-columns:1fr}}
/* =================== V2: extra motion layer =================== */
.spark{position:fixed;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;z-index:55;pointer-events:none}
.floatxt{position:fixed;z-index:70;pointer-events:none;font:800 18px var(--sans);color:var(--green);text-shadow:0 2px 8px rgba(0,0,0,.15)}
.trail{position:fixed;left:0;top:0;z-index:49;pointer-events:none;width:10px;height:10px;border-radius:50%;background:var(--orange);opacity:.45}

/* sliding highlight bar */
.vcode{position:relative}
.vcode .cl{position:relative;z-index:1}
.vcode .cl.cur{background:transparent;box-shadow:none}
.hlbar{position:absolute;left:0;right:0;top:0;height:24px;background:rgba(244,183,42,.2);box-shadow:inset 4px 0 #F4B72A;z-index:0;transition:transform .38s cubic-bezier(.3,1.3,.5,1),height .3s,opacity .3s;opacity:0;pointer-events:none}

/* evaluation bubble, stage by stage */
.ev{background:transparent;padding:2px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center;animation:none}
.ev .evp{background:#F4B72A;color:#231a00;padding:3px 9px;border-radius:7px;opacity:0;animation:evp .4s cubic-bezier(.3,1.6,.5,1) forwards}
.ev .eva{color:#F4B72A;opacity:0;animation:evp .3s forwards;font-weight:700}
.ev .evp.t{background:#45C07F;color:#062312}.ev .evp.f{background:#F26473;color:#2b0509}
@keyframes evp{from{opacity:0;transform:translateY(-6px) scale(.8)}to{opacity:1;transform:none}}
/* rolling values */
.vv,.fv,.cell b{overflow:hidden;display:inline-block}
.vtxt{display:inline-block}
.roll .vtxt{animation:rollin .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes rollin{0%{transform:translateY(-120%);opacity:0}100%{transform:none;opacity:1}}
.roll{animation:glow 1s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(244,183,42,.9)}100%{box-shadow:0 0 0 12px rgba(244,183,42,0)}}
.fghost{position:fixed;z-index:48;pointer-events:none;margin:0}
.explain p.wipe{animation:wipe .8s linear}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.explain .lb.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.viz{position:relative}
.vshake{animation:vshake .5s}
@keyframes vshake{15%,45%,75%{transform:translate(-7px,2px)}30%,60%,90%{transform:translate(7px,-2px)}}
.vflash{position:absolute;inset:0;border-radius:18px;background:radial-gradient(circle,rgba(242,100,115,0) 30%,rgba(242,100,115,.35));opacity:0;pointer-events:none;z-index:5}
.vflash.on{animation:vfl .9s ease-out}
@keyframes vfl{0%{opacity:1}100%{opacity:0}}
.vstamp{position:absolute;left:50%;top:50%;z-index:6;pointer-events:none;font:900 34px var(--sans);padding:12px 26px;border:5px solid;border-radius:14px;opacity:0;transform:translate(-50%,-50%)}
.vstamp.ok{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.vstamp.bad{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.vstamp.show{animation:stamp2 2.2s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp2{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4) rotate(-14deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}100%{opacity:0;transform:translate(-50%,-60%) scale(.9) rotate(-8deg)}}
/* scrubber timeline */
.scrub{position:relative;height:16px;background:var(--soft);cursor:pointer;border-bottom:1.5px solid var(--line)}
.scrub .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--amber),var(--orange));transition:width .35s}

.scrub b.x{background:var(--red);width:10px;height:10px;margin:-5px 0 0 -5px}

.scrub:hover{height:16px;box-shadow:inset 0 0 0 2px var(--amber)}

.btn.voice.on{background:var(--purple);color:#fff;box-shadow:none}

section.blk>h2::after{content:"";flex-basis:100%;height:4px;width:70px;max-width:70px;border-radius:2px;background:linear-gradient(90deg,var(--orange),var(--amber));transform:scaleX(0);transform-origin:left;transition:transform .8s .15s cubic-bezier(.2,.8,.2,1)}

.say{border:0;background:var(--soft);border-radius:999px;width:34px;height:34px;font-size:16px;cursor:pointer;flex-shrink:0;transition:.2s}

.say.on{background:var(--purple);animation:pulse 1.2s infinite}

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function restart(el, c) { if (!el) return; el.classList.remove(c); void el.offsetWidth; el.classList.add(c); }
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* ---------- effects ---------- */
function burst(x, y, n = 12, colors = ['#F4B72A', '#E26B00', '#2A6FB0', '#1F8A55', '#6A4FD8']) {
  if (RM) return;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i'); p.className = 'spark'; p.style.background = colors[i % colors.length];
    document.body.appendChild(p);
    const a = Math.PI * 2 * i / n + Math.random() * .5, d = 26 + Math.random() * 42;
    p.animate([{ transform: `translate(${x}px,${y}px) scale(1)`, opacity: 1 }, { transform: `translate(${x + Math.cos(a) * d}px,${y + Math.sin(a) * d}px) scale(0)`, opacity: 0 }],
      { duration: 550 + Math.random() * 350, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => p.remove();
  }
}
function floatText(text, x, y, color) {
  if (RM) return;
  const t = document.createElement('div'); t.className = 'floatxt'; t.textContent = text; if (color) t.style.color = color;
  document.body.appendChild(t);
  t.animate([{ transform: `translate(${x - 30}px,${y}px) scale(.6)`, opacity: 0 }, { transform: `translate(${x - 30}px,${y - 30}px) scale(1.15)`, opacity: 1, offset: .25 }, { transform: `translate(${x - 30}px,${y - 80}px) scale(1)`, opacity: 0 }], { duration: 1300, easing: 'ease-out' }).onfinish = () => t.remove();
}
function center(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
async function typeInto(el, text, perChar = 16, max = 900) {
  if (RM) { el.textContent = text; return; }
  const step = Math.max(1, Math.ceil(text.length * perChar / max));
  for (let i = 0; i <= text.length; i += step) { el.textContent = text.slice(0, i); await new Promise(r => setTimeout(r, perChar)); }
  el.textContent = text;
}

/* ---------- voice narration (free, built into the browser) ---------- */
const VOICE = { on: LS.get('jz-voice', false) };
function plain(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent.replace(/\s+/g, ' ').trim(); }
function pickVoice() { if (!('speechSynthesis' in window)) return null; const vs = speechSynthesis.getVoices(); return vs.find(v => /en[-_]IN/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang) && /natural|google|online/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
function speak(text, rate = 1) {
  return new Promise(res => {
    if (!('speechSynthesis' in window) || !text) { res(); return; }
    speechSynthesis.cancel();
    const say = text.replace(/→/g, ', becomes ').replace(/==/g, ' equals ').replace(/!=/g, ' not equal to ').replace(/>=/g, ' greater than or equal to ').replace(/<=/g, ' less than or equal to ').replace(/\+\+/g, ' plus plus ').replace(/;/g, '.').replace(/[{}]/g, ' ');
    const u = new SpeechSynthesisUtterance(say); u.rate = rate; u.lang = 'en-IN';
    const v = pickVoice(); if (v) u.voice = v;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 2000 + say.length * 85 / rate);
    speechSynthesis.speak(u);
  });
}
function stopSpeak() { if ('speechSynthesis' in window) speechSynthesis.cancel(); $$('.say.on').forEach(b => { b.classList.remove('on'); b.textContent = '🔊'; }); }

/* ---------- Java syntax highlighting ---------- */
const KW = 'public|private|protected|class|interface|extends|implements|static|final|void|int|double|float|long|short|byte|char|boolean|new|return|if|else|for|while|do|switch|case|break|continue|default|try|catch|finally|throw|throws|this|super|null|true|false|abstract|import|package|var';
const HRE = new RegExp(`(\\/\\/.*$)|("(?:[^"\\\\]|\\\\.)*"?|'(?:[^'\\\\]|\\\\.)'?)|(@\\w+)|\\b(${KW})\\b|\\b(\\d+(?:\\.\\d+)?[LfFdD]?)\\b|\\b([A-Z]\\w*)\\b`, 'g');
function hl(line) {
  let out = '', last = 0, m;
  HRE.lastIndex = 0;
  while ((m = HRE.exec(line))) {
    if (!m[0]) { HRE.lastIndex++; continue; }
    out += esc(line.slice(last, m.index));
    const c = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'an' : m[4] ? 'k' : m[5] ? 'n' : 'ty';
    out += `<span class="${c}">${esc(m[0])}</span>`;
    last = HRE.lastIndex;
  }
  return out + esc(line.slice(last));
}
function J(code) { return `<pre class="code">${code.replace(/^\n/, '').replace(/\n\s*$/, '').split('\n').map((l, i) => `<span class="ln" data-i="${i}">${hl(l) || ' '}</span>`).join('')}</pre>`; }

/* ---------- program builder ---------- */
function program(title, code, build) {
  code = code.replace(/^\n/, '').replace(/\n\s*$/, '');
  const lines = code.split('\n');
  const L = (s, nth = 1) => { let c = 0; for (let i = 0; i < lines.length; i++) if (lines[i].includes(s) && ++c === nth) return i + 1; throw new Error(`[${title}] line not found: ${s}`); };
  const steps = [];
  const S = (l, n, ops = [], ev = null) => steps.push({ l, n, ops, ev });
  build(L, S, lines.length);
  return { title, code, lines, steps };
}

/* ---------- the visualizer ---------- */
class Viz {
  constructor(root, programs, lessonId) {

        <div class="explain"><span class="lb">Ready</span><p></p></div>
        <div class="viz-grid">
          <div class="vcode"><div class="hlbar"></div><div class="lines"></div></div>
          <div class="mem vstack"><h4><i style="background:var(--blue)"></i>Stack — method calls &amp; their variables</h4><div class="frames"></div></div>

        </div>

function anatomy(el, parts, intro) {

function quiz(el, qs, onDone, id) {

      <div class="g4" style="margin-top:12px">
        <div class="card"><b>1. Write</b><br>You type Java code in a <code>.java</code> file.</div>

      ['System.out.println', 'prints text to the console and moves to a new line. (<code>print</code> without "ln" stays on the same line.)'], '(', ['"Hello, Java!"', 'a <b>String</b> — text inside double quotes.'], [';', 'every statement ends with a semicolon, like a full stop in English.'], '\n    ', ['}', 'closing braces end blocks. Every <code>{</code> needs a matching <code>}</code>.'], '\n}'

public class Main {
    public static void main(String[] args) {

}`, (L, S, N) => {

    S(L('void main'), 'The JVM always starts at <b>main</b>. A new <b>frame</b> (a box for this method\'s variables) is pushed onto the <b>stack</b>.', [['push', 'main()', [['args', 'String[]', '[ ]']]]]);
    S(L('Hello, Java'), '<code>System.out.println</code> sends the text to the console, then moves to a new line.', [['out', 'Hello, Java!']]);
    S(L('I am learning'), 'Java runs statements <b>top to bottom</b>, one after another.', [['out', 'I am learning Java.']]);
    S(N - 1, 'The closing brace ends <code>main</code>. Its frame is removed from the stack.', [['pop']]);

    { q: 'Which one should a developer install?', o: ['JVM only', 'JRE only', 'JDK'], a: 2, why: 'The JDK contains the compiler plus the JRE and JVM.' },
  ]
});

      else if (JKEYS.has(v)) msg = `❌ "${v}" is a Java keyword.`;
      else if (/^[A-Z][A-Z0-9_]*$/.test(v) && v.length > 1) { ok = true; msg = '✅ Valid — looks like a CONSTANT (use with final).'; }
      else if (/^[A-Z]/.test(v)) { ok = true; msg = '✅ Valid, but variables usually start lowercase. Capitals are for class names.'; }
      else if (v.includes('_')) { ok = true; msg = '✅ Valid, but Java style prefers camelCase over snake_case.'; }

      else if (m >= 35) { pts = [[40, 60], [200, 60], [440, 60], [680, 60], [680, 168]]; box = 'rC'; txt = `90? no → 75? no → ${m} >= 35 true → Grade C`; }

public class Main {
    public static void main(String[] args) {
        int marks = 78;
        String grade;

        } else if (marks >= 75) {
            grade = "B";
        } else {
            grade = "C";
        }
        System.out.println("Grade: " + grade);

        int day = 3;
        switch (day) {
            case 1: System.out.println("Mon"); break;

    S(L('marks >= 90'), 'Java checks the first condition. It is <b>false</b>, so the block below is <b>skipped</b>.', [['skip', L('grade = "A"')]], 'marks >= 90 → 78 >= 90 → false');
    S(L('marks >= 75'), 'Next condition — this one is <b>true</b>! Java will enter this block.', [], 'marks >= 75 → 78 >= 75 → true');
    S(L('grade = "B"'), '<code>grade</code> gets "B".', [['set', 'grade', '"B"']]);

    { q: 'What happens if you forget break in a classic switch?', o: ['Compile error', 'It falls through into the next case', 'Nothing'], a: 1 },
  ]

  programs: () => [program('Find the max', `
public class Main {
    public static void main(String[] args) {
        int[] marks = {72, 95, 60, 88};
        int max = marks[0];
        for (int i = 1; i < marks.length; i++) {
            if (marks[i] > max) {
                max = marks[i];
            }
        }
        System.out.println("Highest = " + max);
        marks[2] = 65;
        System.out.println("Length = " + marks.length);
    }
}`, (L, S, N) => {
    const F = L('for (int i'), IF = L('if (marks[i] > max)'), SET = L('max = marks[i]');
    const M = [72, 95, 60, 88];
    S(L('void main'), 'Program starts.', [['push', 'main()', []]]);
    S(L('int[] marks'), 'The array object is created in the <b>heap</b> with 4 slots. The variable <code>marks</code> stores only its <b>address</b> (the arrow).', [['harr', '@1', 'int[]', M], ['ref', 'marks', 'int[]', '@1']]);
    S(L('int max = marks[0]'), 'Start by assuming the first element is the biggest. The value flies from slot [0] into <code>max</code>.', [['hi', '@1', 0], ['decl', 'max', 'int', 72, 'heap:@1:0']], 'marks[0] → 72');
    S(F, 'Start at index 1 (we already used index 0).', [['decl', 'i', 'int', 1]], 'int i = 1');
    let max = 72;
    for (let i = 1; i < 4; i++) {
      S(F, `Check: is i still a valid index?`, [], `i < marks.length → ${i} < 4 → true`);
      const big = M[i] > max;
      S(IF, `Compare slot [${i}] with the current max.`, [['hi', '@1', i]], `marks[${i}] > max → ${M[i]} > ${max} → ${big}`);
      if (big) { S(SET, `New highest found! ${M[i]} replaces ${max}.`, [['set', 'max', M[i], `heap:@1:${i}`]]); max = M[i]; }
      S(F, 'Move to the next index.', [['set', 'i', i + 1]], `i++ → ${i + 1}`);
    }
    S(F, 'i reached 4 = length → loop ends.', [['del', 'i'], ['hi', null]], 'i < marks.length → 4 < 4 → false');
    S(L('"Highest = "'), 'Print the result.', [['out', 'Highest = 95']]);
    S(L('marks[2] = 65'), 'Update slot [2] directly in the heap: 60 becomes 65.', [['hi', '@1', 2], ['hset', '@1', 2, 65]]);
    S(L('"Length = "'), '<code>.length</code> is the number of slots (no brackets — it\'s a field, not a method).', [['hi', null], ['out', 'Length = 4']], 'marks.length → 4');
    S(N - 1, 'main ends.', [['pop']]);
    S(N, '✅ Done. The same "find max" pattern works for min, sum, average and search.', [['end']]);
  })],

  ]

  program('Inheritance & polymorphism', `
class Animal {
    String name;
    Animal(String name) { this.name = name; }
    void sound() { System.out.println(name + " makes a sound"); }
}

class Dog extends Animal {
    Dog(String name) { super(name); }
    @Override
    void sound() { System.out.println(name + " says Woof"); }
}

class Cat extends Animal {
    Cat(String name) { super(name); }
    @Override
    void sound() { System.out.println(name + " says Meow"); }
}

public class Main {
    public static void main(String[] args) {
        Animal a1 = new Dog("Tommy");
        Animal a2 = new Cat("Kitty");
        a1.sound();
        a2.sound();
    }
}`, (L, S, N) => {
    S(L('void main'), 'Program starts.', [['push', 'main()', []]]);
    const make = (id, v, T, nm) => {
      S(L(`new ${T}`), `Creating a ${T}. A ${T} <b>is an</b> Animal, so it inherits the <code>name</code> field.`, [['hnew', id, T, [['name', 'String', 'null']]]], `new ${T}("${nm}")`);

      S(L(`${T}(String name)`), '<code>super(name)</code> calls the <b>parent</b> constructor (Animal). Another frame is stacked on top!', [['push', 'Animal(name)', [['this', T, null, null, id], ['name', 'String', `"${nm}"`, 'var:name']]]], 'super(name)');
      S(L('Animal(String name)'), 'Animal\'s constructor stores the name in the inherited field.', [['hset', id, 'name', `"${nm}"`, 'var:name']]);
      S(L(`new ${T}`), `Both constructors finish (2 frames popped). <code>${v}</code>'s type is <b>Animal</b>, but the object is really a <b>${T}</b>.`, [['pop'], ['pop'], ['ref', v, 'Animal', id, `heap:${id}`]]);
    };
    make('@1', 'a1', 'Dog', 'Tommy');
    make('@2', 'a2', 'Cat', 'Kitty');
    S(L('a1.sound()'), 'Which <code>sound()</code> runs? Java checks the <b>real object</b> (a Dog), not the variable type (Animal). This is <b>polymorphism</b>.', [['push', 'Dog.sound()', [['this', 'Dog', null, null, '@1']]]], 'a1 → Dog object → Dog.sound()');
    S(L('says Woof'), 'Dog\'s overridden version runs.', [['out', 'Tommy says Woof'], ['pop']]);
    S(L('a2.sound()'), 'Same kind of call — but a2 points to a Cat.', [['push', 'Cat.sound()', [['this', 'Cat', null, null, '@2']]]], 'a2 → Cat object → Cat.sound()');
    S(L('says Meow'), 'Cat\'s version runs. Notice Animal\'s "makes a sound" never printed — both children <b>overrode</b> it.', [['out', 'Kitty says Meow'], ['pop'], ['skip', L('makes a sound')]]);
    S(N - 1, 'main ends.', [['pop']]);
    S(N, '✅ Done. Same method call, different behaviour — that\'s polymorphism. Spring uses this everywhere.', [['end']]);
  })],
  quiz: [
    { q: 'What does new Student("Ravi", 85) do?', o: ['Declares a class', 'Creates an object in the heap and runs the constructor', 'Prints a student'], a: 1 },
    { q: 'Making fields private with getters/setters is…', o: ['Inheritance', 'Encapsulation', 'Polymorphism'], a: 1 },
    { q: 'Animal a = new Dog(); a.sound(); — whose sound() runs?', o: ['Animal\'s', 'Dog\'s', 'Neither — compile error'], a: 1, why: 'Java looks at the actual object at runtime (Dog).' },
  ]

/* ---------------- 11. Exceptions ---------------- */
LESSONS.push({
  id: 'exceptions', title: 'Exceptions', mins: 15,
  sum: 'Exceptions are runtime errors. Handle them with try / catch / finally so your program doesn\'t crash.',
  html: () => `
  <section class="blk">
    <h2>The safety net</h2>
    <p class="intro">An exception is "thrown" like a falling ball. A <code>catch</code> block is the net. No net? The program crashes.</p>
    <div class="stage">
      <div class="netscene" id="net">
        <div class="tryb">try { risky code }</div>
        <div class="catchb" id="catchb">catch (Exception e) { … }</div>
        <div class="floor">PROGRAM CRASH ZONE</div>
        <span class="ball2" id="ball2">💥</span>
        <div class="msg" id="netMsg">Press "Throw" to see what happens.</div>
      </div>
      <div class="row"><div class="sw">Use try–catch <button class="tgl on" id="netT" aria-label="Toggle try-catch"></button></div><button class="btn red" id="netGo">Throw an exception</button></div>
    </div>
  </section>

  <section class="blk">
    <h2>try, catch, finally, throw</h2>
    <div class="g2">
      <div class="card">${J(`try {
    // code that might fail
} catch (ArithmeticException e) {
    // runs ONLY if that exception happens
} finally {
    // ALWAYS runs (cleanup)
}`)}</div>
      <div class="card"><ul class="clean">
        <li><b>try</b> — wrap the risky code.</li>
        <li><b>catch</b> — handle a specific exception type. You can have several catch blocks.</li>
        <li><b>finally</b> — always runs, error or not. Used to close files and connections.</li>
        <li><b>throw</b> — create your own exception: <code>throw new IllegalArgumentException("Age can't be negative");</code></li>
        <li><b>throws</b> — a method warns callers it might throw: <code>void read() throws IOException</code></li></ul></div>
    </div>
  </section>

  <section class="blk">
    <h2>▶ Trace an exception</h2>
    <p class="intro">Tab 1: caught safely. Tab 2: not caught — watch the crash.</p>
    <div data-viz></div>
  </section>

  <section class="blk">
    <h2>The exception family tree</h2>
    <p class="intro">Tap a box. Dashed boxes are <b>checked</b> exceptions (the compiler forces you to handle them).</p>
    <div class="stage">
      <div class="tree">
        <div class="lvl"><span class="tn2" data-h="Throwable — the root of everything that can be thrown.">Throwable</span></div>
        <div class="lvl"><span class="tn2" data-h="Error — serious JVM problems (OutOfMemoryError). Don't catch these.">Error</span><span class="tn2 chk" data-h="Exception — problems your program can handle. Its direct children like IOException are CHECKED.">Exception</span></div>
        <div class="lvl"><span class="tn2 chk" data-h="IOException (checked) — file or network trouble. Must be caught or declared with throws.">IOException</span><span class="tn2 chk" data-h="SQLException (checked) — database errors.">SQLException</span><span class="tn2" data-h="RuntimeException (unchecked) — usually programming bugs. Compiler doesn't force you to catch them.">RuntimeException</span></div>
        <div class="lvl"><span class="tn2" data-h="ArithmeticException — e.g. 10 / 0 with ints.">Arithmetic</span><span class="tn2" data-h="NullPointerException — calling a method on null. The most common Java bug!">NullPointer</span><span class="tn2" data-h="ArrayIndexOutOfBoundsException — index &lt; 0 or ≥ length.">ArrayIndexOutOfBounds</span><span class="tn2" data-h="NumberFormatException — Integer.parseInt(&quot;abc&quot;).">NumberFormat</span></div>
      </div>
      <div class="cap" id="exCap">Tap a box to learn about it.</div>
    </div>
  </section>

  <section class="blk">
    <h2>Custom exceptions (used a lot in Spring)</h2>
    <div class="g2">
      <div>${J(`class ProductNotFoundException extends RuntimeException {
    ProductNotFoundException(Long id) {
        super("Product " + id + " not found");
    }
}

// somewhere in a service:
if (product == null) {
    throw new ProductNotFoundException(id);
}`)}</div>
      <div><div class="note good"><span class="ic">✅</span><div><b>Do:</b> catch specific exceptions, give clear messages, clean up in finally.</div></div>
      <div class="note bad"><span class="ic">❌</span><div><b>Don't:</b> write an empty <code>catch (Exception e) { }</code>. It hides bugs silently.</div></div>
      <div class="note tip"><span class="ic">🌱</span><div>In Spring, a custom exception + <code>@ExceptionHandler</code> turns into a clean <b>404 Not Found</b> response.</div></div></div>
    </div>
  </section>`,

patch('intro', L => {

  <section class="blk">
    <h2>Watch it happen: type → compile → run</h2>

      <pre class="ide-code" id="ideCode"><span class="caret2"></span></pre>

    const say = (h, add = true) => { term.innerHTML = add ? term.innerHTML + h : h; };
    const type = async () => {
      stage = 0; cls.classList.remove('on'); code.classList.remove('bin'); term.innerHTML = '$ ';
      for (let i = 0; i <= SRC.length; i++) {
        if (!code.isConnected) return;
        code.innerHTML = SRC.slice(0, i).split('\n').map(hl).join('\n') + '<span class="caret2"></span>';
        await sleep(SRC[i] === '\n' ? 90 : 22);
      }
      stage = 1;
    };
    const compile = async () => {
      if (stage < 1) { say('javac Main.java\n<span class="er">error: file not found: Main.java (type the code first!)</span>\n$ ', true); restart(term, 'shake'); return; }
      say('javac Main.java\n');
      code.classList.add('bin');
      for (let f = 0; f < 14; f++) {
        if (!code.isConnected) return;
        code.textContent = SRC.split('\n').map(l => l.replace(/\S/g, () => Math.random() < .5 ? '0' : '1')).join('\n');
        await sleep(70);
      }
      code.textContent = 'CA FE BA BE 00 00 00 41 00 1D 0A 00 02 00 03 07\n00 04 0C 00 05 00 06 01 00 10 6A 61 76 61 2F 6C\n61 6E 67 2F 4F 62 6A 65 63 74 01 00 06 3C 69 6E\n…  (this is bytecode — made for the JVM, not for humans)';
      cls.classList.remove('on'); void cls.offsetWidth; cls.classList.add('on');
      const [x, y] = center(cls); burst(x, y, 16);
      say('✔ compiled → Main.class created\n$ '); stage = 2;
    };
    const run = async () => {
      if (stage < 2) { say('java Main\n<span class="er">Error: Could not find or load main class Main</span>\n<span class="er">(no .class file yet — compile first!)</span>\n$ '); restart(term, 'shake'); return; }
      say('java Main\n'); await sleep(400);
      const span = document.createElement('span'); span.style.color = '#F4B72A'; term.appendChild(span);
      await typeInto(span, 'Hello, Java!', 60, 900); say('\n$ ');
      const [x, y] = center(term); burst(x, y, 20);

    const guard = fn => async () => { if (busy) return; busy = true; try { await fn(); } finally { busy = false; } };
    $('#ideType', root).onclick = guard(type);

/* ---- Methods: recursion on the call stack ---- */
patch('methods', L => {
  const p = L.programs;
  L.programs = () => [...p(), program('Bonus: recursion', `
public class Main {
    static int fact(int n) {
        if (n == 1) {
            return 1;
        }
        return n * fact(n - 1);
    }

    public static void main(String[] args) {
        int result = fact(3);
        System.out.println("3! = " + result);
    }
}`, (L2, S, N) => {
    const IF = L2('if (n == 1)'), R1 = L2('return 1'), RN = L2('return n * fact');
    S(L2('void main'), 'A method that <b>calls itself</b> is recursive. Watch the stack grow like a pile of plates.', [['push', 'main()', []]]);
    S(L2('int result = fact(3)'), 'main calls fact(3). New frame!', [['push', 'fact(n=3)', [['n', 'int', 3, 'line']]]], 'fact(3)');
    S(IF, 'Is this the smallest case (the <b>base case</b>)? Not yet.', [], 'n == 1 → 3 == 1 → false');
    S(RN, 'fact(3) needs fact(2) first — so it <b>waits</b> and calls itself again.', [['push', 'fact(n=2)', [['n', 'int', 2, 'line']]]], 'n * fact(n - 1) → 3 * fact(2) → wait…');
    S(IF, 'Still not the base case.', [], 'n == 1 → 2 == 1 → false');
    S(RN, 'fact(2) needs fact(1). Third frame of fact on the stack!', [['push', 'fact(n=1)', [['n', 'int', 1, 'line']]]], 'n * fact(n - 1) → 2 * fact(1) → wait…');
    S(IF, '<b>Base case reached!</b> This stops the recursion — without it, the stack would overflow.', [], 'n == 1 → 1 == 1 → true');
    S(R1, 'fact(1) returns 1. Its frame is removed and the value flies back to fact(2).', [['pop', 1, 'fact(1)', 'int']], 'return 1');
    S(RN, 'Now fact(2) can finish its multiplication.', [['pop', 2, 'fact(2)', 'int']], '2 * fact(1) → 2 * 1 → 2');
    S(RN, 'And fact(3) finishes too. The stack unwinds back down.', [['pop', 6, 'result', 'int']], '3 * fact(2) → 3 * 2 → 6');
    S(L2('"3! = "'), 'Back in main with the answer.', [['out', '3! = 6']]);
    S(N - 1, 'main ends.', [['pop']]);
    S(N, '✅ Done. The stack went 1 → 4 frames deep and back. Every recursive call needs a base case!', [['end']]);
  })];
});

patch('arrays', L => {
  insertBefore(L, /<section class="blk">\s*<h2>2D arrays/, `
  <section class="blk">
    <h2>Arrays in action: bubble sort 🫧</h2>
    <p class="intro">Sorting is one of the most common things you do with arrays. Watch neighbours being compared (yellow) and swapped (orange). Big values "bubble" to the end.</p>
    <div class="stage sortw">
      <div><div class="bars" id="bars"></div>
        <div class="sortstats"><span>Comparisons: <b id="sCmp">0</b></span><span>Swaps: <b id="sSw">0</b></span><span>Pass: <b id="sPass">0</b></span></div>
        <div class="row" style="margin-top:12px"><button class="btn orange" id="sPlay">▶ Sort it</button><button class="btn ghost" id="sShuf">🔀 Shuffle</button></div>
        <div class="cap" id="sCap" style="text-align:left"></div></div>
      <div id="sCode"></div>
    </div>
  </section>`);
  addMount(L, root => {
    const CODE = `for (int i = 0; i < n - 1; i++) {
    for (int j = 0; j < n - 1 - i; j++) {
        if (a[j] > a[j + 1]) {
            int temp = a[j];      // swap
            a[j] = a[j + 1];
            a[j + 1] = temp;
        }
    }
}`;
    $('#sCode', root).innerHTML = J(CODE);
    const lines = $$('#sCode .ln', root), mark = idx => lines.forEach((l, k) => l.classList.toggle('hlline', idx.includes(k)));
    const barsEl = $('#bars', root), cap = $('#sCap', root);
    let arr = [], els = [], running = false, gen = 0;
    const draw = vals => {
      barsEl.innerHTML = ''; els = vals.map((v, i) => { const b = document.createElement('div'); b.className = 'sbar2'; b.style.setProperty('--i', i); b.style.height = (30 + v * 18) + 'px'; b.textContent = v; barsEl.appendChild(b); return b; });
      arr = vals.slice(); ['#sCmp', '#sSw', '#sPass'].forEach(s => $(s, root).textContent = 0); mark([]); cap.textContent = `a = {${vals.join(', ')}}`;
    };
    const shuffle = () => { gen++; running = false; $('#sPlay', root).textContent = '▶ Sort it'; draw([5, 2, 9, 1, 7, 3, 8, 4].sort(() => Math.random() - .5)); };
    $('#sShuf', root).onclick = shuffle;
    $('#sPlay', root).onclick = async () => {
      if (running) return; running = true; const my = ++gen; const n = arr.length; let cmp = 0, sw = 0;
      if (els.some(e => e.classList.contains('ok'))) draw(arr);
      const t = () => my !== gen || !barsEl.isConnected;
      for (let i = 0; i < n - 1; i++) {
        $('#sPass', root).textContent = i + 1; mark([0]); await sleep(250);
        let swapped = false;
        for (let j = 0; j < n - 1 - i; j++) {
          if (t()) return;
          mark([1, 2]); els[j].classList.add('cmp'); els[j + 1].classList.add('cmp');
          cmp++; $('#sCmp', root).textContent = cmp; cap.textContent = `a[${j}] > a[${j + 1}] → ${arr[j]} > ${arr[j + 1]} → ${arr[j] > arr[j + 1]}`;
          await sleep(420);
          if (arr[j] > arr[j + 1]) {
            mark([3, 4, 5]); els[j].classList.add('sw'); els[j + 1].classList.add('sw');
            [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]]; [els[j], els[j + 1]] = [els[j + 1], els[j]];
            els[j].style.setProperty('--i', j); els[j + 1].style.setProperty('--i', j + 1);
            sw++; swapped = true; $('#sSw', root).textContent = sw; await sleep(430);
          }
          els[j].classList.remove('cmp', 'sw'); els[j + 1].classList.remove('cmp', 'sw');
        }
        els[n - 1 - i].classList.add('ok'); const [x, y] = center(els[n - 1 - i]); burst(x, y, 8);
        if (!swapped) { cap.textContent = 'No swaps in this pass → already sorted, we can stop early!'; break; }
      }
      if (t()) return;
      els.forEach(e => e.classList.add('ok')); mark([]);
      cap.textContent = `Sorted: {${arr.join(', ')}} — ${cmp} comparisons, ${sw} swaps.`;
      running = false;
    };
    shuffle();
  });
});

  $('#navList').innerHTML = `<button class="lesson-link ${current === -1 ? 'on' : ''}" data-i="-1"><span class="num">🏠</span><span>Home &amp; course map</span><span></span></button><h3 style="font-size:13px;color:var(--muted);margin:14px 10px 8px">Lessons</h3>` +
    LESSONS.map((l, i) => `<button class="lesson-link ${current === i ? 'on' : ''} ${d.has(l.id) ? 'done' : ''}" data-i="${i}"><span class="num">${d.has(l.id) ? '✓' : i + 1}</span><span>${l.title}</span><span class="tick"></span></button>`).join('');
  $$('#navList .lesson-link').forEach(b => b.onclick = () => { go(+b.dataset.i); $('#side').classList.remove('open'); });
}
let wiping = false;
async function go(i, push = true) {
  i = Math.max(-1, Math.min(LESSONS.length - 1, i));
  if (wiping) return;
  const w = $('#wipe');
  if (current !== null && !RM) { wiping = true; w.className = 'in'; await sleep(310); }
  stopSpeak();
  if (viz) { viz.destroy(); viz = null; }
  rainOn = false; current = i;
  if (i === -1) renderHome(); else renderLesson(i);
  if (push) { try { history.replaceState(null, '', '#' + (i === -1 ? 'home' : LESSONS[i].id)); } catch (e) {} }
  window.scrollTo({ top: 0, behavior: 'auto' });
  renderNav();
  tipKey = i === -1 ? 'home' : LESSONS[i].id; tipI = 0; setTimeout(javiNext, 700);
  if (wiping) { w.className = 'out'; await sleep(360); w.className = ''; wiping = false; }
}
function decorate(root) {
  // read-aloud buttons + reveal
  $$('section.blk > h2', root).forEach(h => {
    const b = document.createElement('button'); b.className = 'say'; b.textContent = '🔊'; b.setAttribute('aria-label', 'Read this section aloud'); b.title = 'Read this section aloud';
    b.onclick = async () => {
      if (b.classList.contains('on')) { stopSpeak(); return; }
      stopSpeak(); b.classList.add('on'); b.textContent = '⏹';
      const c = h.parentElement.cloneNode(true); $$('pre, .viz, svg, button, .anat, canvas, select, input, textarea', c).forEach(x => x.remove());
      await speak(c.textContent.replace(/\s+/g, ' ').trim(), 1);
      b.classList.remove('on'); b.textContent = '🔊';
    };
    h.appendChild(b);
  });
  if (revealObs) revealObs.disconnect();
  revealObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); revealObs.unobserve(e.target); } }), { threshold: .08 });
  $$('section.blk', root).forEach(sec => {
    revealObs.observe(sec);
    let d = 0;
    [...sec.children].filter(c => c.tagName !== 'H2').forEach(c => {
      const kids = /\bg[234]\b/.test(c.className) ? [...c.children] : [c];
      kids.forEach(k => { if (k.querySelector('[data-viz]') || k.hasAttribute('data-viz')) return; k.classList.add('reveal'); k.style.transitionDelay = (Math.min(d++, 6) * 80) + 'ms'; revealObs.observe(k); });
    });
  });
  $$('.reveal', root).forEach(el => revealObs.observe(el));
}
function renderLesson(i) {
  const L = LESSONS[i], root = $('#lesson');
  root.innerHTML = `
    <header class="l-head">
      <div class="kicker fadeup">Lesson ${i + 1} of ${LESSONS.length}</div>
      <h1>${L.title.split('').map((ch, k) => `<span style="display:inline-block;animation:dropin .6s ${k * 28}ms cubic-bezier(.3,1.6,.5,1) both">${ch === ' ' ? '&nbsp;' : esc(ch)}</span>`).join('')}</h1>
      <p class="sum fadeup">${L.sum}</p>
      <div class="chips fadeup"><span class="chip">⏱ about ${L.mins} min</span>${L.programs ? '<span class="chip">▶ runnable code</span>' : ''}${L.quiz ? '<span class="chip">✅ quick quiz</span>' : ''}<span class="chip">🔊 tap the speaker on any heading to listen</span></div>
    </header>
    ${L.html()}
    ${L.quiz ? `<section class="blk"><h2>Quick check ✅</h2><p class="intro">Get all ${L.quiz.length} right to complete this lesson (+50 XP).</p><div id="lq"></div></section>` : ''}
    <nav class="pager">
      ${i > 0 ? `<button class="btn ghost" id="prevL">← ${LESSONS[i - 1].title}</button>` : '<button class="btn ghost" id="homeL">← Home</button>'}
      ${i < LESSONS.length - 1 ? `<button class="btn" id="nextL">${LESSONS[i + 1].title} →</button>` : ''}
    </nav>`;
  try { L.mount && L.mount(root); } catch (e) { console.error(e); }
  const vz = $('[data-viz]', root);
  if (vz && L.programs) viz = new Viz(vz, L.programs(), L.id);
  if (L.quiz) quiz($('#lq', root), L.quiz, () => { markDone(L.id); confetti(60); }, L.id);
  $('#prevL') && ($('#prevL').onclick = () => go(i - 1));
  $('#homeL') && ($('#homeL').onclick = () => go(-1));
  $('#nextL') && ($('#nextL').onclick = () => go(i + 1));
  decorate(root);
  document.title = `${L.title} — Java from Zero`;
}

/* ---- home ---- */
function renderHome() {

  const title = 'Java from Zero';
  root.innerHTML = `

        <p class="hh-sub">An animated beginner course. Read a little, press <b>Run</b>, and watch every line of Java move data through memory.</p>
        <div class="row"><button class="btn orange big" id="startBtn">${next > 0 ? `Continue: ${LESSONS[next].title}` : 'Start lesson 1'} →</button>${next > 0 ? '<button class="btn ghost big" id="restartBtn" style="background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)">Start from lesson 1</button>' : ''}</div>
      </div>
      <svg class="cupsvg" viewBox="0 0 220 230" aria-hidden="true">
        <path class="steam" d="M80,90 C70,70 95,60 82,40 C72,25 90,15 84,0"/><path class="steam" d="M110,90 C100,70 125,60 112,40 C102,25 120,15 114,0"/><path class="steam" d="M140,90 C130,70 155,60 142,40 C132,25 150,15 144,0"/>
        <path d="M45,100 H175 V150 C175,190 145,210 110,210 C75,210 45,190 45,150 Z" fill="#fff"/><path d="M175,115 C205,115 205,160 172,160" fill="none" stroke="#fff" stroke-width="12"/>
        <ellipse cx="110" cy="100" rx="65" ry="10" fill="#7A4A2B"/><ellipse cx="110" cy="222" rx="80" ry="8" fill="rgba(0,0,0,.25)"/>
        <text x="110" y="168" text-anchor="middle" font-family="monospace" font-weight="800" font-size="30" fill="#D96500">{ }</text>
      </svg>
    </div>
  </section>
  <section class="blk"><h2>Your journey</h2><p class="intro">13 stops from zero to beginner master. Click any stop. The ☕ shows how far you've come.</p>
    <div class="stage map"><svg viewBox="0 0 1000 440" id="mapSvg"></svg></div></section>
  <section class="blk how"><h2>How every lesson works</h2>
    <div class="g3">
      <div class="card"><span class="em bob">📖</span><h3>1. Read the idea</h3><p>Short theory, real-life analogies, and "go deeper" sections only when you want more.</p></div>
      <div class="card"><span class="em pulse">▶️</span><h3>2. Run the code</h3><p>Watch each line run, values fly into memory boxes, methods stack up, and objects appear with arrows.</p></div>
      <div class="card"><span class="em wiggle">🏆</span><h3>3. Play &amp; check</h3><p>Mini-games, a predict-the-output challenge and a quiz. Earn XP, level up, and get a certificate.</p></div>
    </div></section>
  <section class="blk"><h2>Handy controls</h2>
    <div class="g2"><div class="card"><h3>⌨ Keyboard</h3><p><span class="kbd">→</span> next step &nbsp; <span class="kbd">←</span> previous step &nbsp; <span class="kbd">Space</span> play / pause (when the code runner is on screen)</p></div>
    <div class="card"><h3>🔊 Listen instead of reading</h3><p>Every heading has a speaker button. In the code runner, switch on <b>Voice</b> to hear each step. The voice is your browser's own — Chrome and Edge usually sound best.</p></div></div></section>`;
  $('#startBtn').onclick = () => go(Math.max(0, next));
  $('#restartBtn') && ($('#restartBtn').onclick = () => go(0));
  drawMap(d);
  startRain();
  decorate(root);
  document.title = 'Java from Zero — Animated Beginner Course';
}
function drawMap(d) {
  const svg = $('#mapSvg'), NS = 'http://www.w3.org/2000/svg';
  const rows = [[0, 5, 70], [5, 10, 220], [10, 13, 370]];
  const pts = [];
  rows.forEach(([a, b, y], r) => { for (let i = a; i < b; i++) { const k = i - a, n = 5; const x = r % 2 === 0 ? 90 + k * 205 : 910 - k * 205; pts.push([x, y]); } });
  let dstr = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    if (y0 === y1) dstr += ` L${x1},${y1}`; else { const out = x0 > 500 ? 70 : -70; dstr += ` C${x0 + out},${y0} ${x1 + out},${y1} ${x1},${y1}`; }
  }
  const el = (t, a, p = svg) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const base = el('path', { d: dstr, class: 'mp' });
  const L = base.getTotalLength();
  const stLen = pts.map(([x, y]) => { let best = 0, bd = 1e9; for (let s = 0; s <= L; s += 4) { const p = base.getPointAtLength(s); const dd = (p.x - x) ** 2 + (p.y - y) ** 2; if (dd < bd) { bd = dd; best = s; } } return best; });
  const doneCount = LESSONS.reduce((n, l, i) => d.has(l.id) ? Math.max(n, i + 1) : n, 0);
  const prog = el('path', { d: dstr, class: 'mp2' });
  const target = doneCount ? stLen[Math.min(doneCount, pts.length - 1)] : 0;
  prog.style.strokeDasharray = L; prog.style.strokeDashoffset = L;
  const shortT = ['Intro', 'Why Java', 'Spring?', 'Types', 'Variables', 'Conditions', 'Loops', 'Methods', 'Arrays', 'OOP', 'Exceptions', 'Interfaces', 'Finish'];
  pts.forEach(([x, y], i) => {
    const g = el('g', { class: 'ms' + (d.has(LESSONS[i].id) ? ' done' : ''), tabindex: 0, role: 'button', 'aria-label': `Lesson ${i + 1}: ${LESSONS[i].title}` });
    el('circle', { cx: x, cy: y, r: 22 }, g);
    const n = el('text', { x, y, class: 'n' }, g); n.textContent = d.has(LESSONS[i].id) ? '✓' : i + 1;
    const t = el('text', { x, y: y + 46, class: 't' }, g); t.textContent = shortT[i];
    g.onclick = () => go(i); g.onkeydown = e => { if (e.key === 'Enter') go(i); };
  });
  const cup = el('text', { x: 0, y: 0, 'font-size': 34, 'text-anchor': 'middle', 'dominant-baseline': 'central' }); cup.textContent = '☕';
  const place = s => { const p = base.getPointAtLength(s); cup.setAttribute('transform', `translate(${p.x},${p.y - 38})`); };
  place(0);
  if (RM) { prog.style.strokeDashoffset = L - target; place(target); return; }
  const t0 = performance.now(), dur = 900 + target * 1.2;
  (function f(t) { if (!svg.isConnected) return; const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); const s = target * e; prog.style.strokeDashoffset = L - s; place(s); if (p < 1) requestAnimationFrame(f); })(t0);
}
function startRain() {
  const c = $('#rain'); if (!c || RM) return;
  const ctx = c.getContext('2d'); rainOn = true;
  const words = ['int', 'class', 'void', 'new', '{', '}', ';', 'if', 'for', 'return', 'public', '0', '1', 'String', 'main', '()', '[]', '++', '==', 'try'];
  let cols = [];
  const size = () => { c.width = c.offsetWidth; c.height = c.offsetHeight; cols = Array.from({ length: Math.ceil(c.width / 46) }, () => ({ y: Math.random() * c.height, v: 0.6 + Math.random() * 1.6, w: words[Math.floor(Math.random() * words.length)] })); };
  size();
  (function f() {
    if (!rainOn || !c.isConnected) return;
    if (c.width !== c.offsetWidth) size();
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.font = 'bold 15px monospace';
    cols.forEach((col, i) => {
      col.y += col.v; if (col.y > c.height + 20) { col.y = -20; col.w = words[Math.floor(Math.random() * words.length)]; }
      ctx.fillStyle = i % 3 ? 'rgba(127,209,255,.22)' : 'rgba(244,183,42,.3)'; ctx.fillText(col.w, i * 46 + 6, col.y);
    });
    requestAnimationFrame(f);
  })();
}

const rootEl = document.documentElement;
{ const t = LS.get('java-zero-theme', null); if (t) rootEl.dataset.theme = t; }
$('#themeBtn').onclick = () => {
  const dark = rootEl.dataset.theme ? rootEl.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

  if (viz) viz.drawArrows();
};
$('#menuBtn').onclick = () => $('#side').classList.toggle('open');
addEventListener('keydown', e => {
  if (!viz || /input|textarea|select/i.test(e.target.tagName)) return;
  const r = viz.root.getBoundingClientRect(); if (r.bottom < 80 || r.top > innerHeight - 80) return;
  if (e.key === 'ArrowRight') { viz.pause(); viz.step(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { viz.back(); e.preventDefault(); }
  else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { viz.toggle(); e.preventDefault(); }
});
if (!RM && matchMedia('(hover: hover)').matches) {
  $('#lesson').addEventListener('mousemove', e => {
    const c = e.target.closest('.card'); if (!c || c.closest('.viz')) return;
    const r = c.getBoundingClientRect(), px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
    c.style.transform = `perspective(700px) rotateY(${px * 6}deg) rotateX(${-py * 6}deg) translateY(-3px)`; c.classList.add('tilt');
  });
  $('#lesson').addEventListener('mouseout', e => { const c = e.target.closest('.card'); if (c && !c.contains(e.relatedTarget)) c.style.transform = ''; });
}

/* ---- confetti ---- */
function confetti(count = 160) {
  if (RM) return;
  const c = $('#confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#E26B00', '#2A6FB0', '#1F8A55', '#E9A100', '#6A4FD8', '#D23B4A'];
  const ps = Array.from({ length: count }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 240, y: innerHeight / 3, vx: (Math.random() - .5) * 15, vy: Math.random() * -13 - 4, s: Math.random() * 8 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); });
    if (++f < 170) requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}

/* ---- start ---- */
updateProgress(); countXP(LS.get('jz-xp', 0));
const startId = (location.hash || '').slice(1);
const startIdx = LESSONS.findIndex(l => l.id === startId);
go(startIdx >= 0 ? startIdx : -1, false);
addEventListener('hashchange', () => { const h = location.hash.slice(1); const k = h === 'home' ? -1 : LESSONS.findIndex(l => l.id === h); if ((k >= 0 || h === 'home') && k !== current) go(k, false); });
