<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Full Stack Java — MySQL to Spring Boot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FA;--paper:#FFFFFF;--ink:#1A2433;--muted:#566378;--line:#D3DCE7;--soft:#E9EFF6;
  --blue:#2A6FB0;--blue-soft:#E1ECF8;--orange:#D96500;--orange-soft:#FDEBD9;--green:#1F8A55;--green-soft:#DDF2E6;
  --red:#D23B4A;--red-soft:#FBE2E5;--purple:#6A4FD8;--purple-soft:#ECE8FD;--amber:#E9A100;--amber-soft:#FFF3D1;
  --code-bg:#132033;--code-ink:#E4ECF6;--code-dim:#7F8FA8;
  --sans:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1522;--paper:#152032;--ink:#E6EDF7;--muted:#9DABC2;--line:#2B3A52;--soft:#1B2940;
  --blue:#5B9BE0;--blue-soft:#16304F;--orange:#FF8B2B;--orange-soft:#3A2614;--green:#45C07F;--green-soft:#133524;
  --red:#F26473;--red-soft:#3F1C24;--purple:#9C87FF;--purple-soft:#28224D;--amber:#F4B72A;--amber-soft:#3A3219;--code-bg:#0A121F;}}
:root[data-theme="dark"]{
  --bg:#0D1522;--paper:#152032;--ink:#E6EDF7;--muted:#9DABC2;--line:#2B3A52;--soft:#1B2940;
  --blue:#5B9BE0;--blue-soft:#16304F;--orange:#FF8B2B;--orange-soft:#3A2614;--green:#45C07F;--green-soft:#133524;
  --red:#F26473;--red-soft:#3F1C24;--purple:#9C87FF;--purple-soft:#28224D;--amber:#F4B72A;--amber-soft:#3A3219;--code-bg:#0A121F;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
code,.mono{font-family:var(--mono);font-size:.9em}
p code,li code,td code,.note code{background:var(--soft);padding:1px 6px;border-radius:5px}
b,strong{font-weight:700}
a{color:var(--blue)}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:60px;padding:0 20px;background:var(--paper);border-bottom:1.5px solid var(--line)}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;white-space:nowrap}
.cup{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--orange);color:#fff;font-size:18px;position:relative}
.cup::before,.cup::after{content:"";position:absolute;top:-9px;width:3px;height:8px;border-radius:2px;background:var(--orange);opacity:.6;animation:steam 2.2s ease-in-out infinite}
.cup::before{left:12px}.cup::after{left:19px;animation-delay:.6s}
@keyframes steam{0%{transform:translateY(4px);opacity:0}50%{opacity:.7}100%{transform:translateY(-6px);opacity:0}}
.topbar .grow{flex:1}
.progress-pill{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-weight:700}
.progress-pill .bar{width:140px;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.progress-pill .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .6s}
.iconbtn{border:0;background:var(--soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}
.menu-btn{display:none}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr)}
.side{position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;padding:18px 14px 40px;border-right:1.5px solid var(--line);background:var(--paper)}
.side h3{font-size:13px;color:var(--muted);margin:6px 10px 10px;font-weight:700}
.lesson-link{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 10px;border-radius:10px;cursor:pointer;font-size:15.5px;line-height:1.3}
.lesson-link .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font:700 13px var(--mono);color:var(--muted);transition:.3s}
.lesson-link:hover{background:var(--soft)}
.lesson-link.on{background:var(--blue-soft);font-weight:700}
.lesson-link.on .num{background:var(--blue);color:#fff}
.lesson-link.done .num{background:var(--green);color:#fff}
.lesson-link .tick{color:var(--green);font-weight:700;font-size:14px}
main{min-width:0;padding:34px 44px 90px}
.lesson{max-width:1180px;margin:0 auto}

/* ---------- lesson typography ---------- */
.l-head{margin-bottom:26px}
.l-head .kicker{font-weight:700;color:var(--orange);font-size:15px}
.l-head h1{font-size:44px;line-height:1.1;margin:6px 0 10px;letter-spacing:-.01em}
.l-head .sum{font-size:20px;color:var(--muted);max-width:68ch;margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--soft);color:var(--muted)}
section.blk{margin:38px 0}
section.blk>h2{font-size:28px;line-height:1.2;margin:0 0 6px}
section.blk>.intro{color:var(--muted);margin:0 0 16px;max-width:72ch}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:20px 22px}
.card h3{margin:0 0 8px;font-size:20px}
.card p{margin:0 0 10px}
.card p:last-child{margin-bottom:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
ul.clean{margin:0;padding-left:20px}
ul.clean li{margin:4px 0}
.note{border-radius:14px;padding:14px 18px;margin:16px 0;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.note .ic{font-size:20px;line-height:1.3}
.note.tip{background:var(--blue-soft)}.note.warn{background:var(--amber-soft)}.note.bad{background:var(--red-soft)}.note.good{background:var(--green-soft)}
table.t{width:100%;border-collapse:separate;border-spacing:0;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;font-size:16px}
table.t th{text-align:left;background:var(--soft);padding:10px 14px;font-size:14.5px}
table.t td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}
.layer{margin-top:14px}
.layer>summary{cursor:pointer;font-weight:700;color:var(--blue);list-style:none;display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:10px;background:var(--blue-soft)}
.layer>summary::-webkit-details-marker{display:none}
.layer>summary::before{content:"+";font:700 16px var(--mono);transition:transform .25s}
.layer[open]>summary::before{content:"−"}
.layer>.inner{padding:14px 2px 0;animation:fadeup .35s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- code ---------- */
pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:14px 0;font:14.5px/1.65 var(--mono);overflow-x:auto}
pre.code .ln{display:block;padding:0 18px;white-space:pre;min-height:1.65em}
.k{color:#C9A7FF}.s{color:#9EE2B3}.c{color:#7F8FA8;font-style:italic}.n{color:#FFCF70}.ty{color:#7FD1FF}.an{color:#FF9E64}
.hlline{background:rgba(244,183,42,.22);box-shadow:inset 4px 0 #F4B72A}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:11px;padding:11px 18px;font:700 15.5px var(--sans);cursor:pointer;background:var(--blue);color:#fff;transition:transform .12s,filter .15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.96)}
.btn.orange{background:var(--orange)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.purple{background:var(--purple)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.inp,select.inp{font:600 16px var(--mono);padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);min-width:0}
input[type=range]{accent-color:var(--blue);width:100%}

/* ---------- animation utils ---------- */
.pop{animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.flash{animation:flash 1s}
@keyframes flash{0%{background:var(--amber-soft);box-shadow:0 0 0 4px var(--amber-soft)}100%{}}
.fadeup{animation:fadeup .45s ease both}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ---------- visualizer ---------- */
.viz{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.viz-tabs{display:flex;gap:6px;padding:12px 14px 0;flex-wrap:wrap}
.viz-tabs button{border:0;background:var(--soft);color:var(--muted);font:700 14px var(--sans);padding:8px 14px;border-radius:10px;cursor:pointer}
.viz-tabs button.on{background:var(--ink);color:var(--bg)}
.viz-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1.5px solid var(--line)}
.viz-bar .btn{padding:9px 14px;font-size:15px}
.viz-bar .count{margin-left:auto;font:700 14px var(--mono);color:var(--muted)}
.viz-bar select{font:700 14px var(--sans);padding:8px;border-radius:9px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.viz-prog{height:5px;background:var(--soft)}
.viz-prog i{display:block;height:100%;width:0;background:var(--orange);transition:width .35s}
.explain{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:14px 18px;background:var(--amber-soft);min-height:74px;border-bottom:1.5px solid var(--line)}
.explain .lb{font:700 13px var(--mono);background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:8px;white-space:nowrap;margin-top:2px}
.explain p{margin:0;font-size:17px;line-height:1.5}
.explain.exc{background:var(--red-soft)}
.explain.fin{background:var(--green-soft)}
.explain.crash{background:var(--red-soft)}
.viz-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,.8fr) minmax(0,.85fr);grid-template-areas:"code stack heap" "code out out";gap:14px;padding:14px}
.vcode{grid-area:code;background:var(--code-bg);border-radius:14px;padding:12px 0;overflow:auto;align-self:start}
.vcode .cl{display:grid;grid-template-columns:38px 1fr;align-items:center;font:13px/1.75 var(--mono);color:var(--code-ink);position:relative;transition:background .25s}
.vcode .cl .no{text-align:right;padding-right:12px;color:var(--code-dim);font-size:12.5px;user-select:none;position:relative}
.vcode .cl .src{white-space:pre;padding-right:14px}
.vcode .cl.visited .no::after{content:"";position:absolute;right:3px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#4F7FB8}
.vcode .cl.cur{background:rgba(244,183,42,.2);box-shadow:inset 4px 0 #F4B72A}
.vcode .cl.cur .no{color:#F4B72A;font-weight:700}
.vcode .cl.cur .no::before{content:"▶";position:absolute;left:4px;color:#F4B72A;font-size:11px;animation:nudge .8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
.vcode .cl.skip .src{text-decoration:line-through;text-decoration-color:#F26473;opacity:.55}
.ev{grid-column:2;justify-self:start;margin:2px 14px 6px 0;font:600 13px/1.4 var(--mono);background:#F4B72A;color:#231a00;padding:4px 10px;border-radius:8px;white-space:normal;animation:evin .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes evin{from{opacity:0;transform:translateY(-6px) scale(.9)}to{opacity:1;transform:none}}
.mem{background:var(--bg);border-radius:14px;padding:12px;min-height:120px}
.mem h4{margin:0 0 10px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.mem h4 i{font-style:normal;width:10px;height:10px;border-radius:3px}
.vstack{grid-area:stack}.vheap{grid-area:heap}.vout{grid-area:out}
.frames{display:flex;flex-direction:column;gap:10px}
.frame{background:var(--paper);border:2px solid var(--line);border-radius:12px;overflow:hidden;transition:opacity .3s,border-color .3s}
.frame.top{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.frame:not(.top){opacity:.62}
.frame.enter{animation:fenter .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes fenter{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:none}}
.fh{display:flex;justify-content:space-between;align-items:center;font:700 13.5px var(--mono);padding:6px 10px;background:var(--blue-soft);color:var(--blue)}
.fh small{font:700 11px var(--sans);color:var(--muted)}
.vars{padding:6px 8px;display:grid;gap:5px}
.var{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font:13.5px var(--mono)}
.var .vn{font-weight:700}
.var .vt{font-size:11.5px;color:var(--muted);justify-self:end}
.var .vv{min-width:52px;text-align:center;padding:3px 8px;border-radius:7px;background:var(--soft);font-weight:700;transition:background .3s}
.var .vv.ref{background:var(--orange-soft);color:var(--orange)}
.var .vv.unset{color:var(--muted);font-weight:400}
.var .vv.pending,.cell.pending b,.fld .fv.pending{opacity:.15}
.var .lock{font-size:12px}
.empty{color:var(--muted);font-size:14px;font-style:italic;padding:6px 2px}
.heap{display:flex;flex-direction:column;gap:10px}
.obj{background:var(--paper);border:2px solid var(--orange);border-radius:12px;overflow:hidden}
.obj.enter{animation:fenter .5s cubic-bezier(.2,1.2,.4,1)}
.obj .oh{display:flex;justify-content:space-between;align-items:center;font:700 13.5px var(--mono);padding:6px 10px;background:var(--orange-soft);color:var(--orange)}
.obj .oh small{font-weight:600;color:var(--muted);font-size:11.5px}
.obj.exc{border-color:var(--red)}.obj.exc .oh{background:var(--red-soft);color:var(--red)}
.fld{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;padding:4px 10px;font:13.5px var(--mono)}
.fld .fv{justify-self:end;padding:2px 8px;border-radius:7px;background:var(--soft);font-weight:700}
.fld .fv.ref{background:var(--orange-soft);color:var(--orange)}
.cells{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px 10px}
.cell{display:grid;justify-items:center;gap:1px}
.cell b{min-width:44px;text-align:center;padding:6px 6px;border-radius:7px;background:var(--soft);font:700 14px var(--mono);border:2px solid transparent;transition:.3s}
.cell i{font:600 11px var(--mono);color:var(--muted);font-style:normal}
.cell.hi b{border-color:var(--amber);background:var(--amber-soft);transform:translateY(-3px)}
.cell b.ref{color:var(--orange);background:var(--orange-soft)}
.console{background:#0B1320;border-radius:10px;padding:10px 12px;font:13.5px/1.6 var(--mono);color:#D7E3F4;min-height:70px}
.console .o{white-space:pre-wrap;word-break:break-word}
.console .o.err{color:#FF8A96}
.console .o.new{animation:typein .5s steps(20)}
@keyframes typein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.console .caret{display:inline-block;width:8px;height:15px;background:#D7E3F4;vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.arrows path{fill:none;stroke:var(--orange);stroke-width:2.2;opacity:.85}
.token{position:fixed;left:0;top:0;z-index:50;pointer-events:none;font:700 13px var(--mono);padding:4px 10px;border-radius:999px;background:var(--orange);color:#fff;box-shadow:0 6px 18px rgba(217,101,0,.35);white-space:nowrap}
.token.err{background:var(--red);box-shadow:0 6px 18px rgba(210,59,74,.4)}
.token.out{background:var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:0 16px 14px;font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- quiz ---------- */
.quiz .q{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.quiz .q p{margin:0 0 10px;font-weight:700}
.quiz .opts{display:flex;flex-wrap:wrap;gap:8px}
.quiz .opts button{border:0;background:var(--soft);color:var(--ink);font:700 15px var(--sans);padding:9px 14px;border-radius:10px;cursor:pointer;transition:.2s}
.quiz .opts button:hover{filter:brightness(.97)}
.quiz .opts button.right{background:var(--green);color:#fff}
.quiz .opts button.wrong{background:var(--red);color:#fff}
.quiz .why{margin-top:10px;font-size:15.5px;color:var(--muted);display:none}
.quiz .q.answered .why{display:block;animation:fadeup .3s}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:24px;border-top:1.5px solid var(--line)}

/* ---------- widgets (shared) ---------- */
.stage{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:18px;overflow:hidden}
.cap{text-align:center;font-weight:700;min-height:28px;margin-top:8px}
.anat{font:15.5px/2.2 var(--mono);background:var(--code-bg);color:var(--code-ink);border-radius:14px;padding:16px 18px;overflow-x:auto;white-space:pre}
.anat .tk{cursor:pointer;border-radius:6px;padding:2px 3px;border-bottom:2px dashed rgba(244,183,42,.6);transition:.2s}
.anat .tk:hover,.anat .tk.on{background:#F4B72A;color:#231a00;border-bottom-color:transparent}
.anat-tip{margin-top:10px;padding:12px 16px;border-radius:12px;background:var(--amber-soft);min-height:52px;font-size:16.5px}

@media (max-width:1100px){
  .viz-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"code code" "stack heap" "out out"}
}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:60px;bottom:0;width:290px;z-index:40;transform:translateX(-102%);transition:transform .3s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  main{padding:24px 16px 80px}
  .l-head h1{font-size:34px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .progress-pill .bar{width:70px}
}
@media (max-width:640px){
  .viz-grid{grid-template-columns:1fr;grid-template-areas:"code" "stack" "heap" "out"}
  .progress-pill{display:none}
  .iconbtn{white-space:nowrap}
  .topbar{padding:0 12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
/* =================== V2: extra motion layer =================== */
.spark{position:fixed;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;z-index:55;pointer-events:none}
.floatxt{position:fixed;z-index:70;pointer-events:none;font:800 18px var(--sans);color:var(--green);text-shadow:0 2px 8px rgba(0,0,0,.15)}
.trail{position:fixed;left:0;top:0;z-index:49;pointer-events:none;width:10px;height:10px;border-radius:50%;background:var(--orange);opacity:.45}
.token{box-shadow:0 0 0 4px rgba(226,107,0,.18),0 8px 22px rgba(217,101,0,.4)}
/* sliding highlight bar */
.vcode{position:relative}
.vcode .cl{position:relative;z-index:1}
.vcode .cl.cur{background:transparent;box-shadow:none}
.hlbar{position:absolute;left:0;right:0;top:0;height:24px;background:rgba(244,183,42,.2);box-shadow:inset 4px 0 #F4B72A;z-index:0;transition:transform .38s cubic-bezier(.3,1.3,.5,1),height .3s,opacity .3s;opacity:0;pointer-events:none}
.hlbar.on{opacity:1}
.hlbar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transform:translateX(-100%);animation:sheen 1.6s ease-in-out infinite}
@keyframes sheen{to{transform:translateX(100%)}}
/* evaluation bubble, stage by stage */
.ev{background:transparent;padding:2px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center;animation:none}
.ev .evp{background:#F4B72A;color:#231a00;padding:3px 9px;border-radius:7px;opacity:0;animation:evp .4s cubic-bezier(.3,1.6,.5,1) forwards}
.ev .eva{color:#F4B72A;opacity:0;animation:evp .3s forwards;font-weight:700}
.ev .evp.t{background:#45C07F;color:#062312}.ev .evp.f{background:#F26473;color:#2b0509}
@keyframes evp{from{opacity:0;transform:translateY(-6px) scale(.8)}to{opacity:1;transform:none}}
/* rolling values */
.vv,.fv,.cell b{overflow:hidden;display:inline-block}
.vtxt{display:inline-block}
.roll .vtxt{animation:rollin .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes rollin{0%{transform:translateY(-120%);opacity:0}100%{transform:none;opacity:1}}
.roll{animation:glow 1s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(244,183,42,.9)}100%{box-shadow:0 0 0 12px rgba(244,183,42,0)}}
.fghost{position:fixed;z-index:48;pointer-events:none;margin:0}
.explain p.wipe{animation:wipe .8s linear}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.explain .lb.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.viz{position:relative}
.vshake{animation:vshake .5s}
@keyframes vshake{15%,45%,75%{transform:translate(-7px,2px)}30%,60%,90%{transform:translate(7px,-2px)}}
.vflash{position:absolute;inset:0;border-radius:18px;background:radial-gradient(circle,rgba(242,100,115,0) 30%,rgba(242,100,115,.35));opacity:0;pointer-events:none;z-index:5}
.vflash.on{animation:vfl .9s ease-out}
@keyframes vfl{0%{opacity:1}100%{opacity:0}}
.vstamp{position:absolute;left:50%;top:50%;z-index:6;pointer-events:none;font:900 34px var(--sans);padding:12px 26px;border:5px solid;border-radius:14px;opacity:0;transform:translate(-50%,-50%)}
.vstamp.ok{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.vstamp.bad{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.vstamp.show{animation:stamp2 2.2s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp2{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4) rotate(-14deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}100%{opacity:0;transform:translate(-50%,-60%) scale(.9) rotate(-8deg)}}
/* scrubber timeline */
.scrub{position:relative;height:16px;background:var(--soft);cursor:pointer;border-bottom:1.5px solid var(--line)}
.scrub .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--amber),var(--orange));transition:width .35s}
.scrub b{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--line);z-index:1}
.scrub b.o{background:var(--green);width:8px;height:8px;margin:-4px 0 0 -4px}
.scrub b.p{background:var(--blue)}
.scrub b.x{background:var(--red);width:10px;height:10px;margin:-5px 0 0 -5px}
.scrub b.e{background:var(--ink)}
.scrub:hover{height:16px;box-shadow:inset 0 0 0 2px var(--amber)}
.predict{padding:0 14px 0}
.predict summary{cursor:pointer;font-weight:700;color:var(--purple);padding:10px 0;list-style:none}
.predict summary::-webkit-details-marker{display:none}
.predict textarea{display:block;box-sizing:border-box;max-width:100%;width:100%;font:14px/1.5 var(--mono);padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical}
.pres{margin:8px 0 12px;font-weight:700}
.pres .diff{font:13.5px/1.6 var(--mono);display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pres .diff div{background:var(--soft);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.btn.voice.on{background:var(--purple);color:#fff;box-shadow:none}
/* section reveal + heading underline */
section.blk>h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
section.blk>h2::after{content:"";flex-basis:100%;height:4px;width:70px;max-width:70px;border-radius:2px;background:linear-gradient(90deg,var(--orange),var(--amber));transform:scaleX(0);transform-origin:left;transition:transform .8s .15s cubic-bezier(.2,.8,.2,1)}
section.blk.in>h2::after{transform:scaleX(1)}
.say{border:0;background:var(--soft);border-radius:999px;width:34px;height:34px;font-size:16px;cursor:pointer;flex-shrink:0;transition:.2s}
.say:hover{background:var(--purple-soft)}
.say.on{background:var(--purple);animation:pulse 1.2s infinite}
/* topbar XP */
.xp{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;background:var(--amber-soft);padding:6px 12px;border-radius:999px;white-space:nowrap}
.xp b{font:800 15px var(--mono);color:var(--orange)}
.xp.bump{animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
.toast{position:fixed;left:50%;bottom:28px;z-index:80;transform:translate(-50%,calc(100% + 80px));visibility:hidden;background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:14px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform .5s cubic-bezier(.2,1.3,.4,1);max-width:90vw}
.toast.show{transform:translate(-50%,0);visibility:visible}
/* page wipe */
#wipe{position:fixed;left:0;right:0;top:60px;bottom:0;z-index:45;pointer-events:none;background:linear-gradient(110deg,var(--orange),var(--amber));transform:scaleX(0);transform-origin:left;display:grid;place-items:center;font-size:70px}
#wipe span{opacity:0;transition:opacity .2s}
#wipe.in{transition:transform .3s cubic-bezier(.7,0,.3,1);transform:scaleX(1)}
#wipe.in span{opacity:1}
#wipe.out{transition:transform .35s cubic-bezier(.7,0,.3,1);transform:scaleX(0);transform-origin:right}
/* background glyphs */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgfx span{position:absolute;bottom:-60px;font:700 28px var(--mono);color:var(--blue);opacity:.07;animation:drift linear infinite}
@keyframes drift{to{transform:translateY(-115vh) rotate(40deg)}}
.layout{position:relative;z-index:1}
main{background:transparent}
/* mascot */
#javi{position:fixed;right:18px;bottom:18px;z-index:42;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
#javi .bean{pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;width:70px;height:86px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
#javi .bean.jump{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-26px) rotate(-8deg)}100%{transform:none}}
#javi .eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bubble2{pointer-events:auto;position:relative;max-width:260px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:12px 30px 12px 14px;font-size:15px;line-height:1.45;box-shadow:0 10px 24px rgba(0,0,0,.15);transform-origin:bottom right;transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .25s;margin-bottom:40px}
.bubble2.hide{transform:scale(0);opacity:0}
.bubble2 p{margin:0}
.bubble2 button{position:absolute;right:6px;top:4px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
.bubble2::after{content:"";position:absolute;right:-10px;bottom:16px;border:8px solid transparent;border-left-color:var(--ink)}
/* home */
.home-hero{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,#132033,#1D4E89 55%,#2A6FB0);color:#fff;min-height:420px;display:grid;align-items:center}
.home-hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hh-inner{position:relative;display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:center;padding:40px 44px}
.hh-title{font-size:62px;line-height:1.02;margin:0 0 14px;letter-spacing:-.02em}
.hh-title span{display:inline-block;animation:dropin .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes dropin{from{opacity:0;transform:translateY(-50px) rotate(-14deg)}to{opacity:1;transform:none}}
.hh-sub{font-size:20px;opacity:.9;max-width:44ch;margin:0 0 22px}
.btn.big{font-size:18px;padding:14px 22px}
.cupsvg{width:100%;max-width:260px;justify-self:center}
.cupsvg .steam{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.7;stroke-dasharray:60 200;animation:steamline 2.6s linear infinite}
.cupsvg .steam:nth-of-type(2){animation-delay:.8s}.cupsvg .steam:nth-of-type(3){animation-delay:1.6s}
@keyframes steamline{from{stroke-dashoffset:200}to{stroke-dashoffset:-60}}
.map svg{width:100%;height:auto;display:block}
.map .mp{fill:none;stroke:var(--line);stroke-width:10;stroke-linecap:round}
.map .mp2{fill:none;stroke:var(--green);stroke-width:10;stroke-linecap:round}
.map .ms{cursor:pointer}
.map .ms circle{fill:var(--paper);stroke:var(--blue);stroke-width:5;transition:.3s}
.map .ms.done circle{fill:var(--green);stroke:var(--green)}
.map .ms text.n{font:800 15px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.map .ms.done text.n{fill:#fff}
.map .ms text.t{font:700 13.5px var(--sans);fill:var(--muted);text-anchor:middle}
.map .ms:hover circle{transform:scale(1.15);transform-box:fill-box;transform-origin:center}
.how .em{font-size:44px;display:inline-block}
.kbd{font:700 13px var(--mono);background:var(--paper);border-radius:6px;padding:3px 8px;box-shadow:inset 0 -2px 0 var(--line),inset 0 0 0 1.5px var(--line)}
/* IDE demo */
.ide{background:var(--code-bg);border-radius:16px;overflow:hidden;box-shadow:0 14px 34px rgba(19,32,51,.25)}
.ide-top{display:flex;gap:7px;align-items:center;padding:10px 14px;background:#0B1626;color:#9DB0CC;font:600 13px var(--mono)}
.ide-top i{width:11px;height:11px;border-radius:50%;display:inline-block}
.ide-code{margin:0;padding:14px 18px;min-height:150px;font:15px/1.7 var(--mono);color:var(--code-ink);white-space:pre;overflow-x:auto}
.ide-code.bin{color:#45C07F;text-shadow:0 0 8px rgba(69,192,127,.6)}
.caret2{display:inline-block;width:9px;height:18px;background:#F4B72A;vertical-align:-3px;animation:blink 1s steps(1) infinite}
.ide-bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#0B1626;align-items:center}
.ide-bar .btn{padding:8px 13px;font-size:14px}
.ide-term{background:#05090F;color:#C9F2D6;font:14px/1.6 var(--mono);padding:12px 16px;min-height:96px;white-space:pre-wrap}
.ide-term .er{color:#FF8A96}
.clsfile{display:inline-block;margin-left:auto;font:700 13px var(--mono);background:var(--orange);color:#fff;border-radius:8px;padding:5px 10px;opacity:0;transform:scale(.4)}
.clsfile.on{animation:popin2 .6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes popin2{to{opacity:1;transform:none}}
/* type sorting game */
.chipsbox{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;padding:12px;border:2px dashed var(--line);border-radius:14px}
.vchip{border:0;font:700 16px var(--mono);padding:9px 14px;border-radius:10px;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--line),inset 0 0 0 2px var(--line);cursor:grab;transition:transform .2s}
.vchip:hover{transform:translateY(-3px)}
.vchip.sel{background:var(--amber);color:#231a00;box-shadow:0 3px 0 #b07b00;transform:translateY(-4px) scale(1.05)}
.buckets{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:14px}
.bucket{border:0;border-radius:14px;background:var(--blue-soft);color:var(--ink);padding:12px 8px 10px;cursor:pointer;min-height:130px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.2s;border-bottom:6px solid var(--blue)}
.bucket.over{background:var(--amber-soft);transform:scale(1.04)}
.bucket .bn{font:800 16px var(--mono)}
.bucket .bc{font:700 12px var(--sans);color:var(--muted)}
.bucket .bl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bucket .bl span{font:700 11px var(--mono);background:var(--paper);border-radius:6px;padding:2px 6px;animation:popin .4s}
.hint{margin-top:10px;min-height:26px;font-weight:700}
/* variable box */
.vbs{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:center}
.mbox{position:relative;height:150px;border:4px solid var(--blue);border-top:0;border-radius:0 0 18px 18px;background:var(--blue-soft);display:grid;place-items:center;transition:.3s}
.mbox.err{border-color:var(--red);background:var(--red-soft)}
.mbox .mlabel{position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--paper);border:2px solid var(--ink);padding:3px 14px;border-radius:8px;font:800 17px var(--mono)}
.mbox .mtype{position:absolute;bottom:8px;right:12px;font:700 13px var(--mono);color:var(--muted)}
.mval{position:absolute;font:900 34px var(--mono);color:var(--blue)}
.vcmds{display:grid;gap:8px}
.vcmds button{text-align:left;border:0;border-radius:10px;padding:11px 14px;font:700 15px var(--mono);background:var(--code-bg);color:var(--code-ink);cursor:pointer;transition:.2s}
.vcmds button:hover{transform:translateX(6px);background:#1C2D45}
/* bubble sort */
.sortw{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.bars{position:relative;height:230px;margin:6px 0 10px}
.sbar2{position:absolute;bottom:0;width:48px;left:calc(var(--i) * 56px);border-radius:10px 10px 4px 4px;background:var(--blue);display:flex;align-items:flex-start;justify-content:center;color:#fff;font:800 15px var(--mono);padding-top:6px;transition:left .38s cubic-bezier(.4,1.4,.5,1),background .25s,transform .25s}
.sbar2.cmp{background:var(--amber);color:#231a00;transform:translateY(-6px)}
.sbar2.sw{background:var(--orange)}
.sbar2.ok{background:var(--green)}
.sortstats{display:flex;gap:16px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.sortstats b{color:var(--ink);font-family:var(--mono)}
/* certificate */
.certwrap{margin-top:16px;display:none}
.certwrap.on{display:block;animation:unroll 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes unroll{from{clip-path:inset(0 0 100% 0);transform:scale(.96)}to{clip-path:inset(0 0 0 0);transform:none}}
.certwrap canvas{width:100%;height:auto;border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.2)}
.tilt{transition:transform .25s ease-out}
@media (max-width:900px){.hh-inner{grid-template-columns:1fr;padding:28px 22px}.hh-title{font-size:42px}.buckets{grid-template-columns:repeat(3,minmax(0,1fr))}.vbs,.sortw{grid-template-columns:1fr}#javi .bean{width:54px;height:66px}.bubble2{max-width:200px;font-size:14px}.xp span{display:none}}
@media (prefers-reduced-motion: reduce){#bgfx{display:none}}
/* =================== FULL STACK: new components =================== */
.k2{color:#C9A7FF;font-weight:700}
.tgl{width:54px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer;transition:.3s;padding:0;flex-shrink:0}
.tgl::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.3s}
.tgl.on{background:var(--green)}.tgl.on::after{left:27px}
.sw{display:flex;gap:10px;align-items:center;font-weight:700}
.qa details{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.qa summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;gap:10px}
.qa summary::-webkit-details-marker{display:none}
.qa summary::before{content:"Q";font:800 13px var(--mono);background:var(--purple);color:#fff;border-radius:6px;padding:2px 7px;height:fit-content}
.qa details[open] summary{background:var(--purple-soft)}
.qa .ans{padding:12px 16px 14px;animation:fadeup .3s}
/* runner shell (shared) */
.rbody{position:relative;padding:14px}
/* SQL runner */
.sqlgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px}
.sqlright{display:grid;gap:12px;align-content:start}
.tables{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.tbl{background:var(--paper);border:2px solid var(--blue);border-radius:12px;overflow:hidden}
.tbl .tname{font:700 13px var(--mono);padding:5px 10px;background:var(--blue-soft);color:var(--blue);display:flex;justify-content:space-between;gap:10px}
.tbl table,.restbl table{border-collapse:collapse;font:13px var(--mono)}
.tbl th,.restbl th{background:var(--soft);padding:4px 10px;text-align:left;font-size:12px;color:var(--muted)}
.tbl td,.restbl td{padding:4px 10px;border-top:1px solid var(--line);transition:background .3s,opacity .3s}
.tbl tr{transition:background .3s,transform .3s}
.tbl tr.scan td{background:var(--amber-soft)}
.tbl tr.scan{box-shadow:inset 4px 0 var(--amber)}
.tbl tr.ok td{background:var(--green-soft)}
.tbl tr.no td{opacity:.35;text-decoration:line-through}
.tbl tr.in td{background:var(--purple-soft)}
.tbl tr.gone td{opacity:.25;text-decoration:line-through;background:var(--red-soft)}
.null{color:var(--muted);font-style:italic}
.temps{display:flex;flex-wrap:wrap;gap:8px}
.tchip{background:var(--purple-soft);border:2px solid var(--purple);color:var(--ink);border-radius:10px;padding:6px 12px;font:13px var(--mono)}
.tchip b{color:var(--purple)}
.restbl{background:var(--paper);border:2px solid var(--green);border-radius:12px;overflow:hidden;min-height:60px}
.restbl .tname{font:700 13px var(--mono);padding:5px 10px;background:var(--green-soft);color:var(--green)}
.restbl tr.rnew td{animation:rowin .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes rowin{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.restbl .emptyr{padding:10px;color:var(--muted);font-size:13px;font-style:italic}
/* Flow runner */
.flowgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"stage stage" "code side";gap:14px}
.flowgrid.nocode{grid-template-areas:"stage stage" "side side"}
.flowgrid.nocode .fside{grid-template-columns:1fr 1fr}
.fstage{grid-area:stage;position:relative;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/22px 22px,var(--bg);border-radius:14px;min-height:300px;overflow:hidden}
.fstage svg.fedges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fstage svg line,.fstage svg path{stroke:var(--line);stroke-width:4;fill:none;stroke-linecap:round}
.fstage svg .hot{stroke:var(--amber);stroke-dasharray:10 8;animation:dashmove .6s linear infinite}
.fstage svg .lnk{stroke:var(--purple);stroke-width:3;stroke-dasharray:6 6;animation:dashmove 1s linear infinite}
@keyframes dashmove{to{stroke-dashoffset:-18}}
.fnode{position:absolute;transform:translate(-50%,-50%);background:var(--paper);border:2.5px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;min-width:104px;max-width:170px;transition:border-color .3s,box-shadow .3s,opacity .4s,transform .4s;z-index:1}
.fnode .fi{font-size:24px;line-height:1.1;display:block}
.fnode .fl{font:700 13px var(--sans);display:block;line-height:1.25}
.fnode .fs{font:600 11px var(--mono);color:var(--muted);display:block;margin-top:2px}
.fnode.act{border-color:var(--orange);box-shadow:0 0 0 5px var(--orange-soft),0 10px 24px rgba(217,101,0,.2);transform:translate(-50%,-50%) scale(1.06)}
.fnode.hid{opacity:0;transform:translate(-50%,-50%) scale(.5);pointer-events:none}
.fnode .fb{position:absolute;top:-12px;right:-10px;background:var(--green);color:#fff;font:700 10.5px var(--mono);border-radius:999px;padding:2px 8px;white-space:nowrap;animation:popin .4s}
.fnode.npop{animation:npop .55s cubic-bezier(.3,1.8,.5,1)}
@keyframes npop{40%{transform:translate(-50%,-50%) scale(1.18)}}
.fside{grid-area:side;display:grid;gap:12px;align-content:start}
.fcode{grid-area:code}
.fpanel{background:var(--bg);border-radius:12px;padding:10px 12px}
.fpanel h4{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
.fdata{display:grid;gap:5px;font:13px var(--mono)}
.fdata div{display:grid;grid-template-columns:auto 1fr;gap:10px;background:var(--paper);border-radius:8px;padding:5px 9px;animation:fadeup .35s}
.fdata div b{color:var(--purple)}

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function restart(el, c) { if (!el) return; el.classList.remove(c); void el.offsetWidth; el.classList.add(c); }
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* ---------- effects ---------- */
function burst(x, y, n = 12, colors = ['#F4B72A', '#E26B00', '#2A6FB0', '#1F8A55', '#6A4FD8']) {
  if (RM) return;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i'); p.className = 'spark'; p.style.background = colors[i % colors.length];
    document.body.appendChild(p);
    const a = Math.PI * 2 * i / n + Math.random() * .5, d = 26 + Math.random() * 42;
    p.animate([{ transform: `translate(${x}px,${y}px) scale(1)`, opacity: 1 }, { transform: `translate(${x + Math.cos(a) * d}px,${y + Math.sin(a) * d}px) scale(0)`, opacity: 0 }],
      { duration: 550 + Math.random() * 350, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => p.remove();
  }
}
function floatText(text, x, y, color) {
  if (RM) return;
  const t = document.createElement('div'); t.className = 'floatxt'; t.textContent = text; if (color) t.style.color = color;
  document.body.appendChild(t);
  t.animate([{ transform: `translate(${x - 30}px,${y}px) scale(.6)`, opacity: 0 }, { transform: `translate(${x - 30}px,${y - 30}px) scale(1.15)`, opacity: 1, offset: .25 }, { transform: `translate(${x - 30}px,${y - 80}px) scale(1)`, opacity: 0 }], { duration: 1300, easing: 'ease-out' }).onfinish = () => t.remove();
}
function center(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
async function typeInto(el, text, perChar = 16, max = 900) {
  if (RM) { el.textContent = text; return; }
  const step = Math.max(1, Math.ceil(text.length * perChar / max));
  for (let i = 0; i <= text.length; i += step) { el.textContent = text.slice(0, i); await new Promise(r => setTimeout(r, perChar)); }
  el.textContent = text;
}

/* ---------- voice narration (free, built into the browser) ---------- */
const VOICE = { on: LS.get('jz-voice', false) };
function plain(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent.replace(/\s+/g, ' ').trim(); }
function pickVoice() { if (!('speechSynthesis' in window)) return null; const vs = speechSynthesis.getVoices(); return vs.find(v => /en[-_]IN/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang) && /natural|google|online/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
function speak(text, rate = 1) {
  return new Promise(res => {
    if (!('speechSynthesis' in window) || !text) { res(); return; }
    speechSynthesis.cancel();
    const say = text.replace(/→/g, ', becomes ').replace(/==/g, ' equals ').replace(/!=/g, ' not equal to ').replace(/>=/g, ' greater than or equal to ').replace(/<=/g, ' less than or equal to ').replace(/\+\+/g, ' plus plus ').replace(/;/g, '.').replace(/[{}]/g, ' ');
    const u = new SpeechSynthesisUtterance(say); u.rate = rate; u.lang = 'en-IN';
    const v = pickVoice(); if (v) u.voice = v;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 2000 + say.length * 85 / rate);
    speechSynthesis.speak(u);
  });
}
function stopSpeak() { if ('speechSynthesis' in window) speechSynthesis.cancel(); $$('.say.on').forEach(b => { b.classList.remove('on'); b.textContent = '🔊'; }); }

/* ---------- Java syntax highlighting ---------- */
const KW = 'public|private|protected|class|interface|extends|implements|static|final|void|int|double|float|long|short|byte|char|boolean|new|return|if|else|for|while|do|switch|case|break|continue|default|try|catch|finally|throw|throws|this|super|null|true|false|abstract|import|package|var';
const HRE = new RegExp(`(\\/\\/.*$)|("(?:[^"\\\\]|\\\\.)*"?|'(?:[^'\\\\]|\\\\.)'?)|(@\\w+)|\\b(${KW})\\b|\\b(\\d+(?:\\.\\d+)?[LfFdD]?)\\b|\\b([A-Z]\\w*)\\b`, 'g');
function hl(line) {
  let out = '', last = 0, m;
  HRE.lastIndex = 0;
  while ((m = HRE.exec(line))) {
    if (!m[0]) { HRE.lastIndex++; continue; }
    out += esc(line.slice(last, m.index));
    const c = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'an' : m[4] ? 'k' : m[5] ? 'n' : 'ty';
    out += `<span class="${c}">${esc(m[0])}</span>`;
    last = HRE.lastIndex;
  }
  return out + esc(line.slice(last));
}
function J(code) { return `<pre class="code">${code.replace(/^\n/, '').replace(/\n\s*$/, '').split('\n').map((l, i) => `<span class="ln" data-i="${i}">${hl(l) || ' '}</span>`).join('')}</pre>`; }

/* ---------- small shared widgets ---------- */
function anatomy(el, parts, intro) {
  el.innerHTML = `<div class="anat">${parts.map((p, i) => Array.isArray(p) ? `<span class="tk" data-i="${i}" tabindex="0">${esc(p[0])}</span>` : esc(p)).join('')}</div><div class="anat-tip">${intro || '👆 Click any highlighted part to see what it means.'}</div>`;
  $$('.tk', el).forEach(t => {
    const show = () => { $$('.tk', el).forEach(x => x.classList.remove('on')); t.classList.add('on'); const tip = $('.anat-tip', el); tip.innerHTML = `<b>${esc(parts[t.dataset.i][0].trim())}</b> — ${parts[t.dataset.i][1]}`; restart(tip, 'fadeup'); const [x, y] = center(t); burst(x, y, 8); };
    t.onclick = show; t.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(); } };
  });
}
function quiz(el, qs, onDone, id) {
  el.classList.add('quiz');
  el.innerHTML = qs.map((q, i) => `<div class="q" data-q="${i}"><p>${i + 1}. ${q.q}</p><div class="opts">${q.o.map((o, k) => `<button data-k="${k}">${o}</button>`).join('')}</div><div class="why">${q.why || ''}</div></div>`).join('');
  let right = 0;
  $$('.q', el).forEach(qd => {
    const qi = +qd.dataset.q, q = qs[qi];
    $$('button', qd).forEach(b => b.onclick = () => {
      if (qd.classList.contains('answered')) return;
      const ok = +b.dataset.k === q.a;
      b.classList.add(ok ? 'right' : 'wrong'); restart(b, ok ? 'pop' : 'shake');
      const [x, y] = center(b);
      if (ok) { qd.classList.add('answered'); right++; burst(x, y, 14); if (typeof award === 'function') award(`quiz:${id}:${qi}`, 10, x, y); if (right === qs.length && onDone) onDone(); }
    });
  });
}

/* ---------- more languages ---------- */
const SQLKW = 'SELECT|FROM|WHERE|JOIN|INNER|LEFT|RIGHT|FULL|OUTER|CROSS|ON|AS|IN|AND|OR|NOT|NULL|IS|GROUP|BY|ORDER|HAVING|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|PROCEDURE|VIEW|INDEX|BEGIN|END|DECLARE|IF|THEN|ELSE|ELSEIF|CALL|DELIMITER|OUT|INOUT|INT|VARCHAR|CHAR|TABLE|PRIMARY|KEY|FOREIGN|REFERENCES|EXISTS|DISTINCT|COUNT|AVG|SUM|MAX|MIN|LIMIT|EXPLAIN|DROP|UNIQUE|AUTO_INCREMENT|DESC|ASC|UNION|ANY|ALL|DECIMAL|USE|DATABASE|BIGINT|DEFAULT|REPLACE';

        case 'dbhi': (Array.isArray(a[0]) ? a[0] : [a[0]]).forEach(i => st.dbm[i] = 'hi'); break;
        case 'end': st.ended = a[0] || 'ok'; st.act = null; break;
        case 'err': st.err = true; break;
      }
    }
  }
  render() {
    const st = this.state;

    }

  }
  center(id) { const n = $(`[data-node="${id}"]`, this.root), s = $('.fstage', this.root); if (!n || !s) return null; const r = n.getBoundingClientRect(), sr = s.getBoundingClientRect(); return [r.left + r.width / 2 - sr.left, r.top + r.height / 2 - sr.top]; }
  drawEdges() {
    const svg = $('svg.fedges', this.root); if (!svg || !this.state) return;
    const st = this.state, sh = st.shown;

    const line = (a, b, cls) => { const p = this.center(a), q = this.center(b); if (!p || !q) return ''; return `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" class="${cls}"/>`; };
    svg.innerHTML = this.sc.edges.filter(([a, b]) => sh.has(a) && sh.has(b)).map(([a, b]) => line(a, b, hot.has([a, b].sort().join('|')) && this.anim !== null ? 'hot' : '')).join('') + st.links.map(([a, b]) => line(a, b, 'lnk')).join('');
  }
  playFx(fx, pre) {
    const st = this.state, dur = Math.min(1000, this.speed * .6);
    let delay = 0;
    st.gos.forEach(([from, to, label, kind]) => {

      if (!a || !b) return;

      const pw = p.offsetWidth, ph = p.offsetHeight;

      const mx = (sx + ex) / 2, my = (sy + ey) / 2 - 36;

      p.animate(kf(0, 1), { duration: dur, delay, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'both' }).onfinish = () => { p.remove(); restart(b, 'npop'); const [x, y] = center(b); burst(x, y, 10, [col, '#F4B72A']); };

const LESSONS = [];

  departments: { cols: ['id', 'name'], rows: [[1, 'CSE'], [2, 'ECE'], [3, 'MECH'], [4, 'CIVIL']] },

const STU = DB().students.rows, DEP = DB().departments.rows;
const depName = id => (DEP.find(d => d[0] === id) || [])[1];

const sampleTables = () => `<div class="g2">

/* ---------------- 1. Subqueries ---------------- */
LESSONS.push({
  id: 'subq', title: 'Subqueries', mins: 15, group: 'MySQL',
  sum: 'A query inside another query. The inner one runs first and its answer is used by the outer one.',
  html: () => `
  <section class="blk"><h2>The sample database</h2><p class="intro">Every MySQL lesson uses these two small tables, so you can follow every row.</p>${sampleTables()}</section>
  <section class="blk"><h2>The big idea: inside-out</h2>
    <p class="intro">Question: <i>"Who scored more than the class average?"</i> You need the average first. A subquery calculates it, then gets <b>replaced by its answer</b>.</p>
    <div class="stage"><div class="inside">SELECT name FROM students WHERE marks &gt; <span class="inner" id="inner">(SELECT AVG(marks) FROM students)</span>;</div>
    <div class="row" style="margin-top:12px"><button class="btn orange" id="evalIn">Evaluate the inner query</button><button class="btn ghost" id="evalReset">Reset</button></div><div class="cap" id="inCap" style="text-align:left"></div></div>
  </section>
  <section class="blk"><h2>3 kinds of subqueries</h2>
    <div class="g3">
      <div class="card"><h3>1. Scalar</h3><p>Returns <b>one value</b>. Use with <code>=</code> <code>&gt;</code> <code>&lt;</code>.</p>${SQL(`WHERE marks > (SELECT AVG(marks)
                FROM students)`)}</div>
      <div class="card"><h3>2. Multi-row</h3><p>Returns a <b>list</b>. Use with <code>IN</code>, <code>ANY</code>, <code>ALL</code>.</p>${SQL(`WHERE dept_id IN (SELECT id
                  FROM departments
                  WHERE name = 'CSE')`)}</div>
      <div class="card"><h3>3. Correlated</h3><p>Uses a column from the <b>outer</b> query, so it runs <b>once per outer row</b>. Powerful but slower.</p>${SQL(`WHERE s.marks > (SELECT AVG(s2.marks)
   FROM students s2
   WHERE s2.dept_id = s.dept_id)`)}</div>
    </div>
    <details class="layer"><summary>Where else can a subquery go?</summary><div class="inner">
      <div class="g2"><div>${SQL(`-- In FROM (a "derived table" — needs an alias)
SELECT dept_id, avg_m
FROM (SELECT dept_id, AVG(marks) AS avg_m
      FROM students GROUP BY dept_id) AS t
WHERE avg_m > 80;`)}</div><div>${SQL(`-- In SELECT (one value per row)
SELECT name,
       (SELECT name FROM departments d
        WHERE d.id = s.dept_id) AS dept
FROM students s;

-- EXISTS: true if the subquery returns any row
SELECT name FROM departments d
WHERE EXISTS (SELECT 1 FROM students s
              WHERE s.dept_id = d.id);`)}</div></div></div></details>
  </section>
  <section class="blk"><h2>▶ Run the queries row by row</h2><p class="intro">Watch MySQL scan each row. Purple = rows used by the inner query, green = matches, faded = rejected.</p><div data-run></div></section>
  <section class="blk"><div class="g2">
    <div class="note bad"><span class="ic">❌</span><div><b>Error 1242: Subquery returns more than 1 row</b> — you used <code>=</code> but the subquery returned a list. Use <code>IN</code> instead.</div></div>
    <div class="note warn"><span class="ic">⚠️</span><div><b>NULL never matches.</b> <code>NULL IN (1, 2)</code> is unknown, not true — so Kiran never appears.</div></div></div>
    <div class="note tip"><span class="ic">⚡</span><div>Many subqueries can be rewritten as a <b>JOIN</b>, which is often faster. Learn both — interviewers love asking "rewrite this subquery as a join".</div></div>
  </section>`,
  mount(root) {
    const inner = $('#inner', root), cap = $('#inCap', root);
    $('#evalIn', root).onclick = async () => { cap.textContent = 'Step 1: MySQL runs the inner query first… AVG(85, 92, 78, 88, 69) = 412 ÷ 5'; await sleep(900); inner.classList.add('done'); inner.textContent = '82.4'; const [x, y] = center(inner); burst(x, y, 16); cap.innerHTML = 'Step 2: the subquery is <b>replaced by its result</b>. The outer query is now simply <code>WHERE marks &gt; 82.4</code>.'; };
    $('#evalReset', root).onclick = () => { inner.classList.remove('done'); inner.textContent = '(SELECT AVG(marks) FROM students)'; cap.textContent = ''; };
  },
  runner: () => ({ type: 'sql', scenarios: [
    scenario('Scalar: above average', `
SELECT name, marks
FROM students
WHERE marks > (
    SELECT AVG(marks)
    FROM students
);`, (L, S, N) => {
      S(4, 'MySQL runs the <b>inner query first</b> — it\'s in brackets, and the outer WHERE needs its answer.');
      let sum = 0;
      STU.forEach((r, i) => { sum += r[3]; S(5, `Inner query reads ${r[1]}'s marks (${r[3]}) to build the average.`, [['mark', 'students', i, 'in']], `running total → ${sum}`); });
      S(4, 'The inner query becomes <b>one single value</b>: 82.4.', [['clear', 'students'], ['temp', 'AVG(marks)', 82.4]], 'AVG → 412 / 5 → 82.4');
      S(1, 'Now the outer query runs. It really means: <code>WHERE marks &gt; 82.4</code>', [['cols', ['name', 'marks']]]);
      STU.forEach((r, i) => { const ok = r[3] > 82.4; S(3, `${r[1]}: ${ok ? 'above the average → goes into the result' : 'not above the average → skipped'}.`, [['scan', 'students', i], ['mark', 'students', i, ok ? 'ok' : 'no'], ...(ok ? [['emit', [r[1], r[3]], [['students', i]]]] : [])], `${r[3]} > 82.4 → ${ok}`); });
      S(N, '✅ 3 students scored above the class average.', [['end']]);
    }, { tables: DB() }),
    scenario('Multi-row: IN', `
SELECT name
FROM students
WHERE dept_id IN (
    SELECT id FROM departments
    WHERE name IN ('CSE', 'ECE')
);`, (L, S, N) => {
      S(4, 'Inner query first: find the <b>ids</b> of CSE and ECE.');
      DEP.forEach((d, i) => { const ok = ['CSE', 'ECE'].includes(d[1]); S(5, `${d[1]} ${ok ? 'is' : 'is not'} in the list.`, [['scan', 'departments', i], ['mark', 'departments', i, ok ? 'in' : 'no']], `'${d[1]}' IN ('CSE','ECE') → ${ok}`); });
      S(4, 'This subquery returns a <b>list</b> of values, not one value — so the outer query must use <code>IN</code>, not <code>=</code>.', [['temp', 'inner ids', '(1, 2)']], 'result → (1, 2)');
      S(1, 'Outer query: keep students whose dept_id is in (1, 2).', [['cols', ['name']]]);
      STU.forEach((r, i) => { const ok = r[2] === 1 || r[2] === 2; S(3, r[2] === null ? 'Kiran\'s dept_id is NULL. NULL compared with anything is <b>unknown</b>, never true — so Kiran is skipped.' : `${r[1]} has dept_id ${r[2]}.`, [['scan', 'students', i], ['mark', 'students', i, ok ? 'ok' : 'no'], ...(ok ? [['emit', [r[1]], [['students', i]]]] : [])], `${r[2] === null ? 'NULL' : r[2]} IN (1, 2) → ${r[2] === null ? 'unknown' : ok}`); });

    scenario('Correlated: above dept average', `
SELECT s.name, s.marks
FROM students s
WHERE s.marks > (
    SELECT AVG(s2.marks)
    FROM students s2
    WHERE s2.dept_id = s.dept_id

      S(1, 'This inner query uses <code>s.dept_id</code> from the <b>outer row</b>. So it can\'t run just once — it runs <b>again for every student</b>.', [['cols', ['name', 'marks']]]);
      STU.forEach((r, i) => {
        S(2, `Outer row: <b>${r[1]}</b> (dept_id ${r[2] === null ? 'NULL' : r[2]}).`, [['clear', 'students', 'in'], ['scan', 'students', i]]);
        const same = r[2] === null ? [] : STU.map((x, k) => x[2] === r[2] ? k : -1).filter(k => k >= 0);
        const avg = same.length ? same.reduce((a, k) => a + STU[k][3], 0) / same.length : null;
        S(6, r[2] === null ? 'Inner query: <code>s2.dept_id = NULL</code> is never true → no rows → AVG is <b>NULL</b>.' : `Inner query re-runs for dept ${r[2]} and finds ${same.length} student${same.length > 1 ? 's' : ''}.`, [['mark', 'students', same, 'in'], ['temp', 'dept average', avg === null ? 'NULL' : avg]], r[2] === null ? 's2.dept_id = NULL → no rows → AVG = NULL' : `AVG(${same.map(k => STU[k][3]).join(', ')}) → ${avg}`);
        const ok = avg !== null && r[3] > avg;
        S(3, ok ? `${r[1]} beats their department average!` : `${r[1]} does not.`, [['clear', 'students', 'in'], ['mark', 'students', i, ok ? 'ok' : 'no'], ...(ok ? [['emit', [r[1], r[3]], [['students', i]]]] : [])], `${r[3]} > ${avg === null ? 'NULL' : avg} → ${avg === null ? 'unknown' : ok}`);
      });
      S(N, '✅ Only Priya beats her department\'s average. Notice the inner query ran 5 times — that\'s why correlated subqueries can be slow on big tables.', [['end']]);
    }, { tables: DB() }),
  ] }),
  qa: [['What is a subquery?', 'A SELECT written inside another SQL statement. The inner query runs first (unless it is correlated) and its result is used by the outer query.'],
    ['Difference between a subquery and a correlated subquery?', 'A normal subquery runs once and does not depend on the outer query. A correlated subquery refers to a column of the outer query, so it runs once for each outer row.'],
    ['When would you use IN vs EXISTS?', 'Both check membership. EXISTS stops at the first matching row and handles NULLs more predictably; it is often preferred with correlated checks on large tables. IN is simple and readable for small lists.'],

/* ---------------- 2. Joins ---------------- */
const JOINS = {
  INNER: { r: ['b'], n: 'Only rows that match in <b>both</b> tables.', rows: 4 },
  LEFT: { r: ['a', 'b'], n: 'All rows from the <b>left</b> table + matches from the right (NULL where none).', rows: 5 },
  RIGHT: { r: ['b', 'c'], n: 'All rows from the <b>right</b> table + matches from the left.', rows: 5 },
  FULL: { r: ['a', 'b', 'c'], n: 'Everything from both sides. MySQL has no FULL JOIN — write LEFT JOIN UNION RIGHT JOIN.', rows: 6 },
};
LESSONS.push({
  id: 'joins', title: 'Joins', mins: 16, group: 'MySQL',
  sum: 'Joins combine rows from two tables using a related column — like matching students to their departments.',
  html: () => `
  <section class="blk"><h2>Why joins?</h2><p class="intro">Data is split into tables to avoid repeating it. A <b>join</b> puts it back together at query time, using the <b>primary key</b> ↔ <b>foreign key</b> link.</p>${sampleTables()}</section>
  <section class="blk venn-blk"><h2>The join types, visually</h2><p class="intro">Left circle = students, right circle = departments. Click a join type.</p>
    <div class="stage venn"><svg viewBox="0 0 330 220"><path id="vA" class="rg" d="M165,40.72 A80,80 0 1,0 165,179.28 A80,80 0 0,1 165,40.72 Z"/><path id="vB" class="rg" d="M165,40.72 A80,80 0 0,1 165,179.28 A80,80 0 0,1 165,40.72 Z"/><path id="vC" class="rg" d="M165,40.72 A80,80 0 1,1 165,179.28 A80,80 0 0,0 165,40.72 Z"/><text x="80" y="110">students</text><text x="250" y="110">depts</text></svg>
    <div><div class="jbtns" id="jbtns">${Object.keys(JOINS).map(k => `<button data-j="${k}">${k} JOIN</button>`).join('')}</div><div id="jtxt" style="font-size:17px"></div><div id="jsql" style="margin-top:10px"></div></div></div>
  </section>
  <section class="blk"><h2>▶ Watch rows get matched</h2><p class="intro">For each row, MySQL looks for a partner using the ON condition. Watch what happens to Kiran (no department) and CIVIL (no students) in each type.</p><div data-run></div></section>
  <section class="blk"><h2>Other joins you should know</h2><div class="g2">
    <div class="card"><h3>SELF JOIN</h3><p>A table joined with itself — e.g. employees and their managers in the same table.</p>${SQL(`SELECT e.name, m.name AS manager
FROM employees e
LEFT JOIN employees m ON e.manager_id = m.id;`)}</div>
    <div class="card"><h3>CROSS JOIN</h3><p>Every row with every row (no ON). 5 students × 4 departments = 20 rows. Rarely what you want!</p>${SQL(`SELECT s.name, d.name
FROM students s CROSS JOIN departments d;`)}</div></div>
    <div class="note bad"><span class="ic">❌</span><div>Forgetting the <code>ON</code> condition (or writing the wrong one) gives a huge, wrong result. Always join on the key columns.</div></div>
  </section>`,
  mount(root) {
    const set = k => {
      $$('#jbtns button', root).forEach(b => b.classList.toggle('on', b.dataset.j === k));
      ['a', 'b', 'c'].forEach(r => $('#v' + r.toUpperCase(), root).classList.toggle('on', JOINS[k].r.includes(r)));
      $('#jtxt', root).innerHTML = `${JOINS[k].n}<br><b>${JOINS[k].rows} rows</b> with our sample data.`;
      $('#jsql', root).innerHTML = SQL(k === 'FULL' ? `SELECT s.name, d.name FROM students s LEFT JOIN departments d ON s.dept_id = d.id
UNION
SELECT s.name, d.name FROM students s RIGHT JOIN departments d ON s.dept_id = d.id;` : `SELECT s.name, d.name
FROM students s ${k} JOIN departments d
  ON s.dept_id = d.id;`);
      restart($('#jtxt', root), 'fadeup');
    };
    $$('#jbtns button', root).forEach(b => b.onclick = () => set(b.dataset.j)); set('INNER');
  },
  runner: () => {
    const joinSc = type => scenario(`${type} JOIN`, `
SELECT s.name, d.name AS dept
FROM students s
${type} JOIN departments d
    ON s.dept_id = d.id;`, (L, S, N) => {
      S(1, `${type} JOIN: ${JOINS[type].n.replace(/<[^>]+>/g, '')}`, [['cols', ['name', 'dept']]]);
      if (type !== 'RIGHT') {
        STU.forEach((r, i) => {
          const di = depIdx(r[2]);
          if (di >= 0) S(4, `${r[1]} → partner found: ${DEP[di][1]}. One combined row is created.`, [['clear', null, 'in'], ['scan', 'students', i], ['mark', 'departments', di, 'in'], ['mark', 'students', i, 'ok'], ['emit', [r[1], DEP[di][1]], [['students', i], ['departments', di]]]], `s.dept_id = d.id → ${r[2]} = ${r[2]} → match ✓`);
