          else S(4, '<b>INNER JOIN drops rows without a partner.</b> Kiran\'s dept_id is NULL, so Kiran disappears.', [['clear', null, 'in'], ['scan', 'students', i], ['mark', 'students', i, 'no']], 'NULL = d.id → no match ✗');
        });
        S(N, type === 'INNER' ? '✅ 4 rows. Kiran (no dept) and CIVIL (no students) are both missing — INNER keeps only matches.' : '✅ 5 rows. Every student appears; CIVIL is still missing because it\'s on the right side.', [['clear', null, 'in'], ['mark', 'departments', 3, 'no'], ['end']]);
      } else {
        DEP.forEach((d, di) => {
          const ms = STU.map((r, k) => r[2] === d[0] ? k : -1).filter(k => k >= 0);
          if (ms.length) S(4, `${d[1]} has ${ms.length} student${ms.length > 1 ? 's' : ''}.`, [['clear', null, 'in'], ['scan', 'departments', di], ['mark', 'students', ms, 'in'], ['mark', 'departments', di, 'ok'], ...ms.map(k => ['emit', [STU[k][1], d[1]], [['students', k], ['departments', di]]])], `d.id = ${d[0]} → ${ms.map(k => STU[k][1]).join(', ')} → match ✓`);
          else S(4, '<b>RIGHT JOIN keeps every right row.</b> CIVIL has no students, so the name side is NULL.', [['clear', null, 'in'], ['scan', 'departments', di], ['mark', 'departments', di, 'ok'], ['emit', [null, d[1]], [['departments', di]]]], 'd.id = 4 → no student ✗ → keep with NULL');
        });
        S(N, '✅ 5 rows. CIVIL appears with NULL; Kiran is missing because he has no department.', [['clear', null, 'in'], ['mark', 'students', 4, 'no'], ['end']]);
      }
    }, { tables: DB() });
    return { type: 'sql', scenarios: [joinSc('INNER'), joinSc('LEFT'), joinSc('RIGHT')] };
  },
  qa: [['Difference between INNER JOIN and LEFT JOIN?', 'INNER JOIN returns only rows with a match in both tables. LEFT JOIN returns all rows from the left table, with NULLs where the right table has no match.'],
    ['Does MySQL support FULL OUTER JOIN?', 'No. You simulate it with a LEFT JOIN UNION a RIGHT JOIN.'],
    ['What is a self join?', 'Joining a table to itself using aliases, e.g. to find each employee\'s manager stored in the same table.'],
    ['Find students who have no department.', 'SELECT s.name FROM students s LEFT JOIN departments d ON s.dept_id = d.id WHERE d.id IS NULL;']],
  quiz: [
    { q: 'Which join keeps Kiran (who has no department)?', o: ['INNER JOIN', 'LEFT JOIN (students on the left)', 'Neither'], a: 1 },
    { q: 'What fills the missing side in a LEFT JOIN?', o: ['0', 'Empty string', 'NULL'], a: 2 },
    { q: 'A CROSS JOIN of 5 rows and 4 rows gives…', o: ['9 rows', '20 rows', '4 rows'], a: 1 },
  ]
});

/* ---------------- 3. Stored procedures ---------------- */
LESSONS.push({
  id: 'proc', title: 'Stored procedures', mins: 15, group: 'MySQL',
  sum: 'A stored procedure is a named set of SQL statements saved inside the database, which you run with CALL — like a method in Java.',
  html: () => `
  <section class="blk"><h2>A method that lives in the database</h2>
    <div class="g2"><div class="card"><h3>Anatomy</h3>${SQL(`DELIMITER //
CREATE PROCEDURE ProcName(IN a INT, OUT b INT)
BEGIN
    -- SQL statements, variables, IF, loops…
END //
DELIMITER ;

CALL ProcName(5, @result);`)}</div>
    <div class="card"><h3>Parameter types</h3><table class="t"><tr><th>Type</th><th>Direction</th><th>Like Java…</th></tr>
      <tr><td><code>IN</code></td><td>caller → procedure</td><td>a normal parameter</td></tr>
      <tr><td><code>OUT</code></td><td>procedure → caller</td><td>a return value</td></tr>
      <tr><td><code>INOUT</code></td><td>both ways</td><td>a value that gets modified</td></tr></table>
      <p style="margin-top:10px"><b>Why DELIMITER?</b> The procedure body contains <code>;</code>. We temporarily change the end-marker to <code>//</code> so MySQL doesn't stop at the first semicolon.</p></div></div>
  </section>
  <section class="blk"><h2>Why use them? Fewer trips over the network</h2>
    <p class="intro">Your app talks to MySQL over the network. Five separate queries = five round trips. One procedure call = one trip.</p>
    <div class="stage"><div class="trips"><div><b>5 separate queries</b><div class="trip" id="tripA"><span class="ep a"><i>☕</i>App</span><span class="ep b"><i>🗄️</i>MySQL</span><span class="dot"></span><span class="cnt">0 trips</span></div></div>
      <div><b>1 stored procedure</b><div class="trip" id="tripB"><span class="ep a"><i>☕</i>App</span><span class="ep b"><i>🗄️</i>MySQL</span><span class="dot" style="background:var(--green)"></span><span class="cnt">0 trips</span></div></div></div>
    <button class="btn orange" id="tripGo" style="margin-top:12px">▶ Race</button></div>
    <div class="g3" style="margin-top:14px"><div class="note good"><span class="ic">✅</span><div><b>Reuse</b> — write the logic once, call it from Java, Python, reports…</div></div><div class="note good"><span class="ic">🔐</span><div><b>Security</b> — give users permission to CALL the procedure, not to touch tables directly.</div></div><div class="note warn"><span class="ic">⚠️</span><div><b>Downside</b> — logic hidden in the DB is harder to test and version. Modern Spring apps keep most logic in Java.</div></div></div>
  </section>
  <section class="blk"><h2>▶ Run two procedures</h2><p class="intro">Purple chips are the procedure's parameters and variables. Watch values flow in through IN and back out through OUT.</p><div data-run></div></section>
  <section class="blk"><details class="layer"><summary>Calling a procedure from Java (JDBC)</summary><div class="inner">${C(`CallableStatement cs = con.prepareCall("{CALL GetGrade(?, ?)}");
cs.setInt(1, 3);                              // IN
cs.registerOutParameter(2, Types.CHAR);       // OUT
cs.execute();
String grade = cs.getString(2);               // "B"`)}</div></details></section>`,
  mount(root) {
    $('#tripGo', root).onclick = async () => {
      const go = async (id, n) => { const t = $(id, root), d = $('.dot', t), c = $('.cnt', t), w = t.offsetWidth - 180; for (let i = 1; i <= n; i++) { d.animate([{ left: '80px' }, { left: (80 + w) + 'px' }, { left: '80px' }], { duration: RM ? 1 : 700, easing: 'ease-in-out' }); await sleep(720); c.textContent = `${i} trip${i > 1 ? 's' : ''}`; } return n; };
      go('#tripA', 5); await go('#tripB', 1); const t = $('#tripB', root); const [x, y] = center(t); burst(x, y, 18); toast('One CALL = one network trip 🚀');
    };
  },
  runner: () => ({ type: 'sql', scenarios: [
    scenario('IN parameter', `
DELIMITER //
CREATE PROCEDURE GetStudentsByDept(IN deptName VARCHAR(20))
BEGIN
    SELECT s.name, s.marks
    FROM students s
    JOIN departments d ON s.dept_id = d.id
    WHERE d.name = deptName;
END //
DELIMITER ;

CALL GetStudentsByDept('CSE');`, (L, S, N) => {
      S(1, 'Change the statement end-marker to <code>//</code>, because the body below contains semicolons.');
      S(2, 'CREATE PROCEDURE <b>saves</b> the procedure inside the database. <b>Nothing runs yet</b> — just like defining a Java method.', [['temp', 'saved', 'GetStudentsByDept ✓']], 'stored in the database ✓');
      S(L('DELIMITER ;'), 'Switch the end-marker back to the normal <code>;</code>.');
      S(N, 'Now we <b>CALL</b> it. The argument \'CSE\' flows into the IN parameter <code>deptName</code>.', [['temp', 'deptName', "'CSE'"]], "CALL → deptName = 'CSE'");
      S(4, 'The body runs: a normal SELECT with a JOIN.', [['cols', ['name', 'marks']]]);
      S(7, 'Filter departments using the parameter. Only CSE matches.', [['mark', 'departments', 0, 'in'], ['mark', 'departments', [1, 2, 3], 'no']], "d.name = deptName → 'CSE' = 'CSE' → true");
      STU.forEach((r, i) => { const ok = r[2] === 1; S(6, `${r[1]} ${ok ? 'is in CSE' : 'is not in CSE'}.`, [['scan', 'students', i], ['mark', 'students', i, ok ? 'ok' : 'no'], ...(ok ? [['emit', [r[1], r[3]], [['students', i]]]] : [])], `s.dept_id = 1 → ${r[2] === null ? 'NULL' : r[2]} = 1 → ${ok}`); });
      S(L('END //'), '✅ The procedure returns its result set to the caller. Next time just write <code>CALL GetStudentsByDept(\'ECE\');</code>', [['end']]);
    }, { tables: DB() }),
    scenario('OUT parameter + IF', `
DELIMITER //
CREATE PROCEDURE GetGrade(IN sid INT, OUT grade CHAR(1))
BEGIN
    DECLARE m INT;
    SELECT marks INTO m FROM students WHERE id = sid;
    IF m >= 90 THEN SET grade = 'A';
    ELSEIF m >= 75 THEN SET grade = 'B';
    ELSE SET grade = 'C';
    END IF;
END //
DELIMITER ;

CALL GetGrade(3, @g);
SELECT @g;`, (L, S, N) => {
      S(2, 'Save a procedure with one IN parameter (input) and one OUT parameter (output).', [['temp', 'saved', 'GetGrade ✓']]);
      S(L('CALL'), 'CALL with 3 as input. <code>@g</code> is a <b>session variable</b> that will receive the OUT value.', [['temp', 'sid', 3], ['temp', 'grade', 'NULL']], 'CALL → sid = 3, grade = NULL');
      S(4, 'DECLARE creates a local variable <code>m</code> (only lives inside this procedure).', [['temp', 'm', 'NULL']]);
      S(5, 'SELECT … INTO copies the found value <b>into the variable</b> instead of returning rows.', [['mark', 'students', [0, 1, 3, 4], 'no'], ['mark', 'students', 2, 'ok'], ['temp', 'm', 78, ['students', 2, 3]]], 'WHERE id = sid → id = 3 → Arjun, 78');
      S(6, 'IF works like Java\'s if.', [], 'm >= 90 → 78 >= 90 → false');
      S(7, 'ELSEIF is true, so grade becomes B.', [['temp', 'grade', "'B'"]], 'm >= 75 → 78 >= 75 → true');
      S(L('END //'), 'The procedure ends. The OUT parameter\'s value is <b>copied back</b> to the caller\'s variable <code>@g</code>.', [['temp', '@g', "'B'", 'tmp:grade']], 'grade → @g = B');
      S(N, 'Read the session variable.', [['cols', ['@g']], ['emit', ['B'], ['tmp:@g']]]);
      S(N, '✅ Arjun (78) gets grade B.', [['end']]);
    }, { tables: { students: DB().students } }),
  ] }),
  qa: [['What is a stored procedure?', 'A named, precompiled-style block of SQL stored in the database and executed with CALL. It can take IN, OUT and INOUT parameters and use variables, IF and loops.'],
    ['Procedure vs function in MySQL?', 'A function must return exactly one value and can be used inside SELECT. A procedure is called with CALL, can return result sets and multiple OUT values, and can run INSERT/UPDATE/DELETE.'],
    ['Why use DELIMITER?', 'So MySQL doesn\'t treat the semicolons inside the procedure body as the end of the CREATE statement.'],
    ['How do you call a procedure from Java?', 'With a CallableStatement: con.prepareCall("{CALL name(?, ?)}"), set IN parameters, register OUT parameters, then execute().']],
  quiz: [
    { q: 'Which keyword runs a stored procedure?', o: ['RUN', 'CALL', 'EXEC'], a: 1 },
    { q: 'Which parameter sends a value BACK to the caller?', o: ['IN', 'OUT', 'DECLARE'], a: 1 },
    { q: 'Why change the DELIMITER?', o: ['To make it faster', 'So semicolons inside the body don\'t end the statement', 'It is required for SELECT'], a: 1 },
  ]
});

/* ---------------- 4. Views & indexes ---------------- */
LESSONS.push({
  id: 'views', title: 'Views & indexes', mins: 15, group: 'MySQL',
  sum: 'A view is a saved query you can use like a table. An index is a lookup structure that makes searching fast.',
  html: () => `
  <section class="blk"><h2>Views: a saved query with a name</h2>
    <div class="g2"><div class="card"><h3>What it is</h3><ul class="clean"><li>A <b>virtual table</b> — it stores the <b>query</b>, not the data.</li><li>Every time you SELECT from it, MySQL runs the query again → always up to date.</li><li>Hides complex joins behind a simple name.</li><li>Security: show only some columns (e.g. hide salary).</li></ul></div>
    <div class="card"><h3>Commands</h3>${SQL(`CREATE VIEW top_students AS
SELECT name, marks FROM students
WHERE marks >= 85;

SELECT * FROM top_students;   -- use like a table
CREATE OR REPLACE VIEW ...    -- change it
DROP VIEW top_students;       -- delete it`)}</div></div>
  </section>
  <section class="blk"><h2>▶ Watch a view stay up to date</h2><p class="intro">We query the view, then change a student's marks, then query the view again. No data is copied — the view simply re-runs.</p><div data-run></div></section>
  <section class="blk"><h2>Indexes: the index at the back of a book</h2>
    <p class="intro">Without an index, MySQL reads <b>every row</b> to find one (a full table scan). With an index (a B-tree), it jumps there in a few hops. Race them!</p>
    <div class="stage"><div class="race">
      <div><b>❌ No index — full table scan</b><div class="scangrid" id="scan" style="margin-top:10px"></div><div class="racecnt" id="scanN">0 rows checked</div></div>
      <div class="btree"><b>✅ With an index — B-tree lookup</b><svg viewBox="0 0 420 230" id="bt" style="margin-top:10px"></svg><div class="racecnt" id="btN">0 hops</div></div>
    </div><div class="row" style="margin-top:12px"><label style="font-weight:700">Find id =</label><input class="inp" type="number" id="findId" value="173" min="1" max="200" style="width:100px"><button class="btn orange" id="raceGo">▶ Race</button></div></div>
    <div class="g2" style="margin-top:14px"><div class="card"><h3>Create and check an index</h3>${SQL(`CREATE INDEX idx_marks ON students(marks);

EXPLAIN SELECT * FROM students WHERE marks = 92;
-- type: ref, key: idx_marks  → index used ✅
-- (without it: type: ALL → full scan)

DROP INDEX idx_marks ON students;`)}</div>
    <div class="card"><h3>When to index</h3><ul class="clean"><li>✅ Columns used in <code>WHERE</code>, <code>JOIN … ON</code>, <code>ORDER BY</code></li><li>✅ Primary keys get an index automatically; MySQL (InnoDB) also indexes foreign keys</li><li>⚠️ Every index makes <b>INSERT/UPDATE/DELETE slower</b> and uses disk space</li><li>❌ Don't index tiny tables or columns with few distinct values (like gender)</li></ul></div></div>
  </section>`,
  mount(root) {
    const grid = $('#scan', root); grid.innerHTML = '<i></i>'.repeat(200);
    const svg = $('#bt', root);
    const nodes = [[210, 30, '1 … 200'], [80, 110, '1–66'], [210, 110, '67–133'], [340, 110, '134–200'], [290, 190, '134–166'], [390, 190, '167–200']];
    svg.innerHTML = [[0, 1], [0, 2], [0, 3], [3, 4], [3, 5]].map(([a, b], i) => `<line data-l="${i}" x1="${nodes[a][0]}" y1="${nodes[a][1] + 16}" x2="${nodes[b][0]}" y2="${nodes[b][1] - 16}"/>`).join('') + nodes.map(([x, y, t], i) => `<rect data-n="${i}" x="${x - 50}" y="${y - 16}" width="100" height="32" rx="8"/><text x="${x}" y="${y}">${t}</text>`).join('');
    let run = 0;
    $('#raceGo', root).onclick = async () => {
      const my = ++run, id = Math.max(1, Math.min(200, +$('#findId', root).value || 173));
      $$('i', grid).forEach(c => c.className = ''); $$('rect, line', svg).forEach(e => e.classList.remove('on', 'f'));
      (async () => { const hops = id <= 66 ? [0, 1] : id <= 133 ? [0, 2] : [0, 3, id <= 166 ? 4 : 5]; const lines = id <= 66 ? [0] : id <= 133 ? [1] : [2, id <= 166 ? 3 : 4];
        for (let h = 0; h < hops.length; h++) { if (my !== run) return; $(`[data-n="${hops[h]}"]`, svg).classList.add(h === hops.length - 1 ? 'f' : 'on'); if (h) $(`[data-l="${lines[h - 1]}"]`, svg).classList.add('on'); $('#btN', root).textContent = `${h + 1} hop${h ? 's' : ''}${h === hops.length - 1 ? ' — found! ⚡' : ''}`; await sleep(450); }
        const [x, y] = center($(`[data-n="${hops[hops.length - 1]}"]`, svg)); burst(x, y, 16); })();
      const cells = $$('i', grid);
      for (let i = 0; i < id; i++) { if (my !== run) return; cells[i].className = 's'; $('#scanN', root).textContent = `${i + 1} rows checked`; if (i % 3 === 0) await sleep(12); }
      cells[id - 1].className = 'f'; $('#scanN', root).textContent = `${id} rows checked — found (finally)`;
    };
  },
  runner: () => ({ type: 'sql', scenarios: [
    scenario('A view stays live', `
CREATE VIEW top_students AS
SELECT s.name, d.name AS dept, s.marks
FROM students s
JOIN departments d ON s.dept_id = d.id
WHERE s.marks >= 85;

SELECT * FROM top_students;

UPDATE students SET marks = 90 WHERE name = 'Arjun';
SELECT * FROM top_students;`, (L, S, N) => {
      S(1, 'CREATE VIEW saves only the <b>query</b>. No rows are copied anywhere.', [['temp', 'view top_students', 'saved query (no data)']]);
      S(L('SELECT * FROM top_students', 1), 'You select from the view like a table. Behind the scenes MySQL <b>runs the saved query</b>.', [['cols', ['name', 'dept', 'marks']]]);
      STU.forEach((r, i) => { const di = depIdx(r[2]); const ok = di >= 0 && r[3] >= 85; S(5, `${r[1]}: ${di < 0 ? 'no department → dropped by the JOIN' : ok ? 'marks ≥ 85 → included' : 'marks below 85 → excluded'}.`, [['clear', null, 'in'], ['scan', 'students', i], ...(di >= 0 ? [['mark', 'departments', di, 'in']] : []), ['mark', 'students', i, ok ? 'ok' : 'no'], ...(ok ? [['emit', [r[1], DEP[di][1], r[3]], [['students', i], ['departments', di]]]] : [])], `${r[3]} >= 85 → ${ok}`); });
      S(L('UPDATE'), 'Now Arjun\'s marks change in the <b>real table</b>. We don\'t touch the view at all.', [['clear'], ['upd', 'students', 2, 3, 90]], "marks → 78 becomes 90");
      S(L('SELECT * FROM top_students', 2), 'Query the view again — it re-runs the saved query on the <b>current</b> data, so Arjun now appears.', [['cols', ['name', 'dept', 'marks']], ['mark', 'students', [0, 1, 2, 3], 'ok'], ['mark', 'students', 4, 'no'], ...[0, 1, 2, 3].map(i => ['emit', [STU[i][1], DEP[depIdx(STU[i][2])][1], i === 2 ? 90 : STU[i][3]], [['students', i]]])]);
      S(N, '✅ The view always shows fresh data because it stores the query, not the rows.', [['clear', null, 'in'], ['end']]);
    }, { tables: DB() }),
  ] }),
  qa: [['Does a view store data?', 'No (in MySQL). It stores the query. Each SELECT on the view runs the query on the current tables.'],
    ['Can you UPDATE through a view?', 'Sometimes — if the view maps simply to one table without GROUP BY, DISTINCT, aggregates or UNION. Complex views are read-only.'],
    ['What is an index and how does it work?', 'A separate sorted structure (a B-tree in InnoDB) that lets MySQL find rows by a column value in a few steps instead of scanning the whole table.'],
    ['Disadvantages of indexes?', 'Extra disk space and slower INSERT/UPDATE/DELETE, because every index must be updated too.'],
    ['How do you check if a query uses an index?', 'Put EXPLAIN before the SELECT and look at the key and type columns. type = ALL means a full table scan.']],
  quiz: [
    { q: 'After the base table changes, a view shows…', o: ['Old data', 'Current data', 'An error'], a: 1 },
    { q: 'Which statement is slowed down by having many indexes?', o: ['SELECT', 'INSERT', 'EXPLAIN'], a: 1 },
    { q: 'EXPLAIN shows type = ALL. What does it mean?', o: ['All indexes used', 'Full table scan', 'Query failed'], a: 1 },
  ]
});

function sortGame(root, items, buckets, doneKey) {
  // items: [text, bucketId, why]; buckets: [id, label, color]
  root.innerHTML = `<div class="chipsbox"></div><div class="buckets" style="grid-template-columns:repeat(${buckets.length},minmax(0,1fr))"></div><div class="hint">Pick a card, then pick where it belongs.</div><button class="btn ghost" style="margin-top:6px">↺ Play again</button>`;
  const box = $('.chipsbox', root), bks = $('.buckets', root), hint = $('.hint', root);
  let sel = null, score = 0;
  const setup = () => {
    score = 0; sel = null; hint.textContent = `Score: 0 / ${items.length}`;
    box.innerHTML = items.map((v, i) => [v, i, Math.random()]).sort((a, b) => a[2] - b[2]).map(([v, i]) => `<button class="vchip" draggable="true" data-i="${i}" style="font-family:var(--sans);font-size:14.5px">${esc(v[0])}</button>`).join('');
    bks.innerHTML = buckets.map(b => `<button class="bucket" data-b="${b[0]}" style="border-bottom-color:${b[2]}"><span class="bn">${b[1]}</span><span class="bc">0 inside</span><span class="bl"></span></button>`).join('');
    $$('.vchip', box).forEach(c => { c.onclick = () => { $$('.vchip', box).forEach(x => x.classList.remove('sel')); c.classList.add('sel'); sel = c; }; c.ondragstart = e => { sel = c; c.classList.add('sel'); e.dataTransfer.setData('text/plain', 'x'); }; });
    $$('.bucket', bks).forEach(b => { b.onclick = () => place(b); b.ondragover = e => { e.preventDefault(); b.classList.add('over'); }; b.ondragleave = () => b.classList.remove('over'); b.ondrop = e => { e.preventDefault(); b.classList.remove('over'); place(b); }; });
  };
  const place = b => {
    if (!sel) { hint.textContent = '👆 Pick a card first.'; restart(hint, 'shake'); return; }
    const c = sel, it = items[+c.dataset.i];
    if (it[1] !== b.dataset.b) { restart(b, 'shake'); hint.innerHTML = `<span style="color:var(--red)">Not quite — think again about "${esc(it[0])}".</span>`; return; }
    const r = c.getBoundingClientRect(), [bx, by] = center(b);
    const fly = c.cloneNode(true); fly.style.cssText += `;position:fixed;left:${r.left}px;top:${r.top}px;margin:0;z-index:60;pointer-events:none`;
    document.body.appendChild(fly); c.remove(); sel = null;
    fly.animate([{ transform: 'none' }, { transform: `translate(${bx - r.left - r.width / 2}px,${by - r.top - r.height / 2 - 50}px) rotate(-6deg)`, offset: .5 }, { transform: `translate(${bx - r.left - r.width / 2}px,${by - r.top - r.height / 2}px) scale(.4)`, opacity: .2 }], { duration: RM ? 1 : 600, easing: 'cubic-bezier(.4,0,.3,1)' }).onfinish = () => {
      fly.remove(); score++; $('.bl', b).insertAdjacentHTML('beforeend', `<span>✓</span>`); $('.bc', b).textContent = `${$$('.bl span', b).length} inside`; restart(b, 'pop'); burst(bx, by, 12);
      hint.innerHTML = `<span style="color:var(--green)">✅ ${it[2]}</span> &nbsp; Score: ${score} / ${items.length}`;
      if (score === items.length) { hint.innerHTML = '🏆 All correct!'; confetti(80); award(doneKey, 50, bx, by); }
    };
  };
  $('button.btn', root).onclick = setup; setup();
}

const SERVLET_CODE = `
@WebServlet("/hello")
public class HelloServlet extends HttpServlet {

    public void init() {
        System.out.println("init: servlet created");
    }

    protected void doGet(HttpServletRequest req, HttpServletResponse res)
            throws IOException {
        String name = req.getParameter("name");
        res.setContentType("text/html");
        PrintWriter out = res.getWriter();
        out.println("<h1>Hello " + name + "</h1>");
    }

    public void destroy() {
        System.out.println("destroy: servlet removed");
    }
}`;

LESSONS.push({
  id: 'servlet', title: 'Servlets', mins: 18, group: 'Web basics',
  sum: 'A servlet is a Java class that runs inside a web server (like Tomcat), receives HTTP requests and sends back responses.',
  html: () => `
  <section class="blk"><h2>What is a servlet?</h2>
    <div class="g2"><div class="card"><ul class="clean">
      <li>A <b>Java class</b> that extends <code>HttpServlet</code>.</li>
      <li>It runs inside a <b>web container</b> (servlet container) such as <b>Apache Tomcat</b>, which creates it and calls its methods.</li>
      <li>It handles HTTP methods with <code>doGet()</code>, <code>doPost()</code>, <code>doPut()</code>, <code>doDelete()</code>.</li>
      <li>It reads input from <code>HttpServletRequest</code> and writes output to <code>HttpServletResponse</code>.</li>
      <li>It is the foundation under Spring MVC — Spring's <code>DispatcherServlet</code> is itself a servlet!</li></ul></div>
    <div class="card"><h3>Mapping a URL to a servlet</h3>${C(`@WebServlet("/hello")          // annotation (modern)
public class HelloServlet extends HttpServlet { … }`)}
      <p style="margin:10px 0 6px">or the older way, in <code>web.xml</code>:</p>${C(`<servlet>
  <servlet-name>hello</servlet-name>
  <servlet-class>com.app.HelloServlet</servlet-class>
</servlet>
<servlet-mapping>
  <servlet-name>hello</servlet-name>
  <url-pattern>/hello</url-pattern>
</servlet-mapping>`, 'xml')}</div></div>
    <div class="note warn"><span class="ic">📦</span><div>Packages: older code uses <code>javax.servlet.*</code>; Tomcat 10+ and Jakarta EE use <code>jakarta.servlet.*</code>. Same ideas, new names.</div></div>
  </section>
  <section class="blk"><h2>Why servlets? CGI vs servlet</h2><p class="intro">Before servlets, CGI started a <b>whole new process</b> for every request — slow and memory-hungry. A servlet is loaded <b>once</b> and each request just gets a lightweight <b>thread</b>.</p>
    <div class="stage"><div class="cgi"><div class="cgibox"><h4>😓 CGI: new process per request</h4><div class="procs" id="cgiA"></div><div class="small">Memory used</div><div class="meter"><i id="memA" style="background:var(--red)"></i></div></div>
      <div class="cgibox"><h4>😎 Servlet: one object, many threads</h4><div class="procs" id="cgiB"></div><div class="small">Memory used</div><div class="meter"><i id="memB" style="background:var(--green)"></i></div></div></div>
    <button class="btn orange" id="cgiGo" style="margin-top:12px">Send 6 requests</button></div>
    <div class="g3" style="margin-top:14px"><div class="card"><h3>⚡ Fast</h3><p>Stays in memory; threads are cheap.</p></div><div class="card"><h3>☕ Java power</h3><p>Use any Java library, JDBC, OOP.</p></div><div class="card"><h3>🛡️ Container help</h3><p>Tomcat handles threads, sessions, security, lifecycle.</p></div></div>
  </section>
  <section class="blk"><h2>The servlet lifecycle</h2><div class="g4">
    <div class="card"><h3>1. Load &amp; create</h3><p>Container loads the class and creates <b>one</b> object (on first request or at startup).</p></div>
    <div class="card"><h3>2. init()</h3><p>Runs <b>once</b>. Set things up.</p></div>
    <div class="card"><h3>3. service()</h3><p>Runs for <b>every request</b>, on its own thread. Calls doGet/doPost.</p></div>
    <div class="card"><h3>4. destroy()</h3><p>Runs <b>once</b> when the app stops. Clean up.</p></div></div></section>
  <section class="blk"><h2>▶ Request → process → response</h2><p class="intro">Tab 1: the very first request (servlet gets created). Tab 2: the next request (reused!). Tab 3: server shutdown.</p><div data-run></div></section>
  <section class="blk"><details class="layer"><summary>doGet vs doPost, forward vs redirect</summary><div class="inner"><table class="t">
    <tr><th></th><th>doGet</th><th>doPost</th></tr><tr><td>Data in</td><td>URL: <code>?name=Ravi</code></td><td>Request body (form)</td></tr><tr><td>Use for</td><td>Reading / searching</td><td>Creating / submitting</td></tr><tr><td>Bookmarkable</td><td>Yes</td><td>No</td></tr></table>
    <p style="margin-top:12px"><b>forward</b> (<code>req.getRequestDispatcher("x.jsp").forward(req, res)</code>) happens inside the server — same request, URL doesn't change. <b>redirect</b> (<code>res.sendRedirect("/login")</code>) tells the browser to make a <i>new</i> request — URL changes.</p></div></details></section>`,

        S(L('public class HelloServlet'), '<b>First request:</b> the servlet isn\'t loaded yet. Tomcat loads the class and creates <b>one</b> object.', [['show', 'servlet'], ['go', 'tomcat', 'servlet', 'new HelloServlet()', 'obj']]);

        S(null, 'Tomcat gives this request its own <b>thread</b>. 100 users = 100 threads sharing the same servlet object.', [['show', 'thread'], ['go', 'tomcat', 'thread', 'req + res', 'req']]);
        S(L('protected void doGet'), 'The thread calls <code>service()</code>, which sees it\'s a GET and calls <code>doGet()</code>.', [['go', 'thread', 'servlet', 'service() → doGet()', 'req']]);

        S(L('out.println') + 1, 'doGet finishes. The response goes back through Tomcat.', [['go', 'servlet', 'tomcat', 'response', 'res']]);
        S(null, 'Tomcat converts the response object into HTTP text and sends it. The thread is released for the next request.', [['go', 'tomcat', 'browser', '200 OK + HTML', 'res'], ['log', 'HTTP/1.1 200 OK — <h1>Hello Ravi</h1>', 'ok'], ['badge', 'thread', 'released']]);

        S(L('public void init()'), '<b>The object already exists</b> — no new object, no <code>init()</code>. This is why servlets are fast.', [['act', 'servlet']]);
        S(L('protected void doGet'), 'A new thread runs doGet on the <b>same</b> servlet object.', [['show', 'thread'], ['go', 'tomcat', 'thread', 'req + res', 'req'], ['go', 'thread', 'servlet', 'doGet()', 'req']]);
        S(L('out.println'), 'Same code, different data.', [['data', 'HttpServletResponse', '<h1>Hello Priya</h1>']], 'name → "Priya"');

const JDBC_SAVE = `public void save(Student s) {
    String sql = "INSERT INTO students(name, marks) VALUES (?, ?)";
    try (Connection con = DriverManager.getConnection(URL, USER, PASS);
         PreparedStatement ps = con.prepareStatement(sql,
                 Statement.RETURN_GENERATED_KEYS)) {
        ps.setString(1, s.getName());
        ps.setInt(2, s.getMarks());
        ps.executeUpdate();
        try (ResultSet keys = ps.getGeneratedKeys()) {
            if (keys.next()) {
                s.setId(keys.getLong(1));
            }
        }
    } catch (SQLException e) {
        throw new RuntimeException(e);
    }
}`;
const HIB_SAVE = `public void save(Student s) {
    session.persist(s);
}`;
LESSONS.push({
  id: 'hibernate', title: 'Why Hibernate replaced JDBC', mins: 18, group: 'Database access',
  sum: 'Hibernate is an ORM framework: you work with Java objects, and it writes the SQL and JDBC code for you.',
  html: () => `
  <section class="blk"><h2>The pain of plain JDBC</h2>
    <div class="g3"><div class="card"><h3>😩 Boilerplate</h3><p>Connections, statements, try/catch, closing — the same 15 lines in every method.</p></div><div class="card"><h3>🔁 Manual mapping</h3><p>Copy every column from ResultSet into an object, and every field back into SQL, by hand.</p></div><div class="card"><h3>🧱 SQL everywhere</h3><p>Rename a column → hunt through every SQL string. Different databases → different SQL.</p></div>
    <div class="card"><h3>⚠️ Checked SQLException</h3><p>Must be caught or declared in every method.</p></div><div class="card"><h3>🐌 No caching</h3><p>Same row requested twice = two database trips.</p></div><div class="card"><h3>🔗 Relationships</h3><p>Loading a student with their department and courses means writing joins and stitching objects yourself.</p></div></div>
  </section>
  <section class="blk"><h2>Same job: save a student</h2><p class="intro">Press the button and watch the boilerplate disappear.</p>
    <div class="stage"><div class="cmp"><div><b>JDBC</b><div class="lc" id="lcA">17 lines</div><div id="cmpA"></div></div><div><b>Hibernate</b><div class="lc" style="color:var(--green)">3 lines</div><div id="cmpB"></div></div></div>
    <button class="btn orange" id="cmpGo" style="margin-top:12px">✂️ Remove the boilerplate</button></div></section>
  <section class="blk"><h2>ORM: objects ↔ tables</h2><p class="intro"><b>O</b>bject <b>R</b>elational <b>M</b>apping. Annotations tell Hibernate which class maps to which table and which field maps to which column.</p>
    <div class="g2"><div>${C(`@Entity
@Table(name = "students")
public class Student {
    @Id
    @GeneratedValue(strategy = GenerationType.IDENTITY)
    private Long id;

    @Column(name = "name")
    private String name;
    private int marks;
    // constructors, getters, setters
}`)}</div>
    <div class="stage"><div class="orm"><div class="ormobj" id="ormO"><b>Student object</b><div>id = 1</div><div>name = "Ravi"</div><div>marks = 85</div></div><div style="text-align:center;font-size:30px" id="ormArrow">⇄</div><div class="ormtbl"><table><tr><th>id</th><th>name</th><th>marks</th></tr><tr><td>1</td><td>Ravi</td><td>85</td></tr></table></div></div><button class="btn purple" id="ormGo" style="margin-top:12px">Map it</button></div></div>
    <div class="tablewrap" style="margin-top:14px"><table class="t"><tr><th>Annotation</th><th>Meaning</th></tr><tr><td><code>@Entity</code></td><td>This class is stored in the database</td></tr><tr><td><code>@Table</code></td><td>Table name (default = class name)</td></tr><tr><td><code>@Id</code></td><td>Primary key</td></tr><tr><td><code>@GeneratedValue</code></td><td>Let the DB generate the id (AUTO_INCREMENT)</td></tr><tr><td><code>@Column</code></td><td>Column name, length, nullable…</td></tr><tr><td><code>@OneToMany</code>, <code>@ManyToOne</code></td><td>Relationships between entities</td></tr></table></div>
  </section>
  <section class="blk"><h2>▶ Watch Hibernate write SQL for you</h2><p class="intro">Notice the "first-level cache": the second <code>get()</code> doesn't hit the database at all.</p><div data-run></div></section>
  <section class="blk"><div class="note tip"><span class="ic">💡</span><div><b>Important nuance for interviews:</b> Hibernate didn't kill JDBC — it runs <b>on top of</b> JDBC. JDBC still does the actual talking to MySQL; Hibernate just generates the SQL and the mapping. <b>JPA</b> is the standard specification (<code>jakarta.persistence</code>); Hibernate is the most popular <b>implementation</b> of it.</div></div>
    <div class="tablewrap"><table class="t"><tr><th></th><th>JDBC</th><th>Hibernate</th></tr><tr><td>You write</td><td>SQL + mapping code</td><td>Java objects + annotations</td></tr><tr><td>Database switch</td><td>Rewrite SQL</td><td>Change the dialect/config</td></tr><tr><td>Caching</td><td>None</td><td>First-level (built-in), second-level (optional)</td></tr><tr><td>Exceptions</td><td>Checked SQLException</td><td>Unchecked</td></tr><tr><td>Control / raw speed</td><td>Full control, fastest for bulk work</td><td>Less control; tune with JPQL/native queries</td></tr></table></div></section>`,
  mount(root) {

  runner: () => ({ type: 'flow', scenarios: [scenario('persist + get', `
Session session = sessionFactory.openSession();
Transaction tx = session.beginTransaction();
Student s = new Student("Ravi", 85);
session.persist(s);            // no SQL written by you!
tx.commit();
session.close();

Session s2 = sessionFactory.openSession();
Student a = s2.get(Student.class, 1L);   // SELECT runs
Student b = s2.get(Student.class, 1L);   // from cache!
s2.close();`, (L, S) => {
    S(1, 'Open a <b>Session</b> — your conversation with the database. It also holds a cache of loaded objects (the <b>persistence context</b>).', [['act', 'sess'], ['data', 'session', 'open']]);
    S(2, 'Writes happen inside a transaction.', [['data', 'transaction', 'started']]);
    S(3, 'A plain Java object. Hibernate doesn\'t know about it yet — it\'s <b>transient</b>.', [['act', 'code'], ['data', 's', 'Student{id=null, Ravi, 85}'], ['data', 's state', 'transient']]);
    S(4, '<code>persist(s)</code> hands the object to Hibernate. It is now <b>managed</b>. Hibernate will write the SQL — you don\'t!', [['go', 'code', 'sess', 'persist(s)', 'obj'], ['data', 's state', 'managed']]);
    S(5, 'On <b>commit</b>, Hibernate flushes: it looks at managed objects and generates SQL for the right database (MySQL dialect).', [['go', 'sess', 'hib', 'flush', 'obj'], ['go', 'hib', 'jdbc', 'insert into students …', 'sql'], ['log', 'Hibernate: insert into students (marks,name) values (?,?)', 'sql']]);
    S(5, 'JDBC sends it to MySQL. A row appears!', [['go', 'jdbc', 'db', 'INSERT', 'sql'], ['dbins', [1, 'Ravi', 85]]]);
    S(5, 'MySQL generated id = 1 (AUTO_INCREMENT). Hibernate copies it back into your object automatically.', [['go', 'db', 'sess', 'id = 1', 'res'], ['data', 's', 'Student{id=1, Ravi, 85}'], ['data', 'transaction', 'committed ✓']]);
    S(6, 'Close the session. The object is now <b>detached</b> (no longer tracked).', [['dclr'], ['data', 'session', 'closed'], ['data', 's state', 'detached']]);
    S(8, 'A new session starts with an <b>empty</b> cache.', [['dclr'], ['data', 'session 2', 'open, cache empty'], ['act', 'sess']]);
    S(9, '<code>get()</code> by id. The cache doesn\'t have Student #1, so Hibernate must query the database.', [['go', 'code', 'sess', 'get(Student, 1)', 'req'], ['go', 'sess', 'hib', 'cache miss', 'req'], ['go', 'hib', 'jdbc', 'select … where id=?', 'sql'], ['log', 'Hibernate: select s1_0.id,s1_0.marks,s1_0.name from students s1_0 where s1_0.id=?', 'sql']]);
    S(9, 'The row comes back and Hibernate builds the Student object from it — no ResultSet code from you.', [['go', 'jdbc', 'db', 'SELECT', 'sql'], ['dbhi', 0], ['go', 'db', 'sess', 'row', 'res'], ['data', 'cache', 'Student#1'], ['go', 'sess', 'code', 'Student a', 'obj']]);
    S(10, 'Same id again → <b>cache hit</b>. No SQL, no database trip! Even better: <code>a == b</code> is true — it\'s the same object.', [['badge', 'sess', 'cache hit ⚡'], ['go', 'code', 'sess', 'get(Student, 1)', 'req'], ['go', 'sess', 'code', 'same object', 'obj'], ['log', '(no SQL — served from first-level cache)', 'ok']], 'cache has Student#1 → no SQL');
    S(11, '✅ You wrote zero SQL and zero mapping code. Hibernate generated the INSERT and SELECT and cached the result.', [['badge', 'sess', null], ['end']]);
  }, { nodes: [{ id: 'code', label: 'Your code', icon: '☕', x: 9, y: 50 }, { id: 'sess', label: 'Session', icon: '📒', sub: 'persistence context', x: 32, y: 50 }, { id: 'hib', label: 'Hibernate', icon: '⚙️', sub: 'generates SQL', x: 55, y: 20 }, { id: 'jdbc', label: 'JDBC', icon: '🔌', sub: 'still used underneath', x: 74, y: 70 }, { id: 'db', label: 'MySQL', icon: '🗄️', x: 92, y: 32 }], edges: [['code', 'sess'], ['sess', 'hib'], ['hib', 'jdbc'], ['jdbc', 'db']], db: { name: 'students', cols: ['id', 'name', 'marks'], rows: [] } })] }),
  qa: [['What is ORM?', 'Object Relational Mapping: mapping Java classes to database tables and objects to rows, so you work with objects instead of SQL and ResultSets.'],
    ['Why use Hibernate instead of JDBC?', 'Less boilerplate, automatic object mapping, database independence via dialects, caching, unchecked exceptions, relationship mapping and automatic SQL generation.'],
    ['Does Hibernate replace JDBC completely?', 'No. Hibernate uses JDBC internally to talk to the database. It replaces the hand-written JDBC code, not JDBC itself.'],

LESSONS.push({
  id: 'ioc', title: 'Spring Core & IoC', mins: 18, group: 'Spring',
  sum: 'Spring\'s core idea: you don\'t create your objects with new — a container creates them (beans) and plugs them together (dependency injection).',
  html: () => `
  <section class="blk"><h2>The problem: tight coupling</h2><p class="intro">If a class creates its own dependencies with <code>new</code>, you can't swap them. Flip the switch to see the difference.</p>
    <div class="stage"><div class="sw" style="margin-bottom:12px">Use Spring (inject the engine) <button class="tgl" id="cplT" aria-label="Toggle dependency injection"></button></div>
    <div class="couple"><div id="cplCode"></div><div class="carbox"><div><span class="car" id="car">🚗</span><span class="eng" id="eng">PetrolEngine</span></div>
      <div class="row" style="margin-top:14px"><button class="btn ghost" id="swapE">Swap to ElectricEngine ⚡</button><button class="btn green" id="drive">Drive</button></div><div class="cap" id="cplCap" style="text-align:left"></div></div></div></div>
  </section>
  <section class="blk"><h2>IoC and DI in plain words</h2><div class="g2">
    <div class="card"><h3>🔄 Inversion of Control (IoC)</h3><p>Normally <i>your code</i> controls object creation. With IoC, <b>control is handed to the Spring container</b>: it creates objects, manages their life, and gives them to you.</p></div>
    <div class="card"><h3>💉 Dependency Injection (DI)</h3><p>The <i>way</i> IoC is done: Spring <b>passes (injects)</b> the objects a class needs, instead of the class creating them.</p></div>
    <div class="card"><h3>🫘 Bean</h3><p>Any object created and managed by the Spring container.</p></div>
    <div class="card"><h3>🏭 ApplicationContext</h3><p>The container itself. It reads your configuration, creates beans and wires them. (<code>BeanFactory</code> is its simpler parent.)</p></div></div>
    <div class="tablewrap" style="margin-top:14px"><table class="t"><tr><th>How to declare beans</th><th>Example</th></tr><tr><td>Stereotype annotations + component scan</td><td><code>@Component</code>, <code>@Service</code>, <code>@Repository</code>, <code>@Controller</code></td></tr><tr><td>Java config</td><td><code>@Configuration</code> class with <code>@Bean</code> methods</td></tr><tr><td>XML (older projects)</td><td><code>&lt;bean id="…" class="…"/&gt;</code> in applicationContext.xml</td></tr></table></div>
  </section>
  <section class="blk"><h2>▶ Watch the container build and wire beans</h2><div data-run></div></section>
  <section class="blk"><h2>Injection types, scopes and lifecycle</h2><div class="g3">
    <div class="card"><h3>3 ways to inject</h3>${C(`// 1. Constructor  ✅ recommended
public StudentService(StudentRepository r) {…}

// 2. Setter
@Autowired
public void setRepo(StudentRepository r) {…}

// 3. Field  (easy but harder to test)
@Autowired
private StudentRepository repo;`)}</div>
    <div class="card"><h3>Bean scopes</h3><ul class="clean"><li><b>singleton</b> (default) — one object for the whole app</li><li><b>prototype</b> — new object every time it's requested</li><li><b>request</b> / <b>session</b> — one per HTTP request / user session (web apps)</li></ul>${C(`@Scope("prototype")
@Component
public class Cart { … }`)}</div>
    <div class="card"><h3>Bean lifecycle</h3><ol class="clean"><li>Instantiate (constructor)</li><li>Inject dependencies</li><li><code>@PostConstruct</code> method</li><li>Bean in use</li><li><code>@PreDestroy</code> on shutdown</li></ol></div></div></section>`,
  mount(root) {
    let di = false, engine = 'PetrolEngine';
    const code = () => { $('#cplCode', root).innerHTML = di ? C(`@Component
public class Car {
    private final Engine engine;      // an interface

    public Car(Engine engine) {       // Spring injects it
        this.engine = engine;
    }
}`) : C(`public class Car {
    private Engine engine = new PetrolEngine();  // hard-wired!

    public void drive() { engine.start(); }
}`); };
    const upd = () => { const e = $('#eng', root); e.textContent = engine; e.classList.toggle('locked', !di); code(); };
    $('#cplT', root).onclick = e => { di = !di; e.currentTarget.classList.toggle('on', di); engine = 'PetrolEngine'; upd(); $('#cplCap', root).textContent = di ? 'Car now asks for any Engine. Spring decides which one to give.' : 'Car creates its own PetrolEngine — it\'s locked in.'; };
    $('#swapE', root).onclick = () => { if (!di) { restart($('#eng', root), 'shake'); $('#cplCap', root).innerHTML = '<span style="color:var(--red)">❌ Can\'t swap! You must edit Car\'s source code and recompile. That\'s tight coupling.</span>'; return; } engine = engine === 'PetrolEngine' ? 'ElectricEngine ⚡' : 'PetrolEngine'; upd(); restart($('#eng', root), 'pop'); const [x, y] = center($('#eng', root)); burst(x, y, 12); $('#cplCap', root).innerHTML = '<span style="color:var(--green)">✅ Swapped without touching Car\'s code — just mark a different Engine bean. That\'s loose coupling.</span>'; };
    $('#drive', root).onclick = async () => { const c = $('#car', root); c.classList.add('drive'); await sleep(900); c.classList.remove('drive'); };
    upd();
  },
  runner: () => ({ type: 'flow', scenarios: [scenario('Container startup', `
@Repository
public class StudentRepository {
    public List<String> findAll() { return List.of("Ravi", "Priya"); }
}

@Service
public class StudentService {

        this.repo = repo;

}

@Configuration
@ComponentScan("com.college")
public class AppConfig { }

public class Main {

}`, (L, S) => {
    S(L('new AnnotationConfigApplicationContext'), 'main starts the <b>Spring container</b>, giving it the config class.', [['go', 'main', 'ctx', 'start container', 'req']]);

LESSONS.push({
  id: 'springmvc', title: 'Spring MVC', mins: 18, group: 'Spring',
  sum: 'Spring MVC is Spring\'s web framework. One front controller — the DispatcherServlet — receives every request and routes it to your controller methods.',
  html: () => `
  <section class="blk"><h2>The front controller pattern</h2><p class="intro">Instead of one servlet per URL, Spring has <b>one</b> servlet — the <b>DispatcherServlet</b> — like a traffic police officer directing every request to the right controller method.</p>
    <div class="g4"><div class="card"><h3>🚦 DispatcherServlet</h3><p>Receives every request, coordinates everything.</p></div><div class="card"><h3>🗺️ HandlerMapping</h3><p>Finds which controller method matches the URL + HTTP method.</p></div><div class="card"><h3>🎮 Controller</h3><p>Your code. Returns a view name (or data for REST).</p></div><div class="card"><h3>🔎 ViewResolver</h3><p>Turns <code>"student"</code> into <code>/WEB-INF/views/student.jsp</code>.</p></div></div></section>
  <section class="blk"><h2>Read a mapping line</h2><div id="mvcAnat"></div></section>
  <section class="blk"><h2>▶ Follow a request through Spring MVC</h2><p class="intro">Tab 1: a classic page (HTML view). Tab 2: a REST API that returns JSON — how most Spring Boot apps work today.</p><div data-run></div></section>
  <section class="blk"><h2>Annotation cheat sheet</h2><div class="tablewrap"><table class="t">
    <tr><th>Annotation</th><th>Does</th></tr><tr><td><code>@Controller</code></td><td>Class handles web requests and returns view names</td></tr><tr><td><code>@RestController</code></td><td><code>@Controller</code> + <code>@ResponseBody</code>: return values become JSON</td></tr>
    <tr><td><code>@RequestMapping("/x")</code></td><td>Base URL for a class or method</td></tr><tr><td><code>@GetMapping</code> <code>@PostMapping</code> <code>@PutMapping</code> <code>@DeleteMapping</code></td><td>Map one HTTP method</td></tr>
    <tr><td><code>@PathVariable</code></td><td>Read <code>{id}</code> from <code>/students/{id}</code></td></tr><tr><td><code>@RequestParam</code></td><td>Read <code>?page=2</code></td></tr><tr><td><code>@RequestBody</code></td><td>Turn JSON in the request body into an object</td></tr><tr><td><code>Model</code></td><td>Carries data from the controller to the view</td></tr></table></div></section>`,
  mount(root) {
    anatomy($('#mvcAnat', root), [['@GetMapping("/{id}")', 'Handle <b>GET</b> requests to <code>/students/{id}</code> (combined with the class\'s <code>@RequestMapping("/students")</code>). <code>{id}</code> is a placeholder.'], '\n', ['public String', 'Returns a <b>String</b> — in a <code>@Controller</code> this is the <b>logical view name</b>, not text for the browser.'], ' ', ['getOne', 'Method name — any name works; the URL mapping is what matters.'], '(', ['@PathVariable int id', 'Takes the <code>{id}</code> part of the URL and converts it to an int. <code>/students/7</code> → <code>id = 7</code>.'], ', ', ['Model model', 'Spring passes in an empty Model. Put data in it with <code>model.addAttribute()</code> for the view to show.'], ')']);
  },
  runner: () => ({ type: 'flow', scenarios: [
    scenario('HTML view', `
@Controller
@RequestMapping("/students")
public class StudentController {

    private final StudentService service;

    public StudentController(StudentService service) {
        this.service = service;
    }

    @GetMapping("/{id}")
    public String getOne(@PathVariable int id, Model model) {
        Student s = service.findById(id);
        model.addAttribute("student", s);
        return "student";          // logical view name
    }
}`, (L, S) => {
      S(null, 'Every request to the app first reaches the <b>DispatcherServlet</b>.', [['go', 'browser', 'ds', 'GET /students/1', 'req'], ['log', 'GET /students/1 HTTP/1.1', 'http']]);
      S(L('@RequestMapping'), 'DispatcherServlet asks HandlerMapping: "who handles GET /students/1?"', [['go', 'ds', 'hm', 'GET /students/1 ?', 'req'], ['go', 'hm', 'ds', 'StudentController.getOne', 'res']]);
      S(L('@GetMapping'), 'DispatcherServlet calls your method. Spring converts <code>{id}</code> from the URL into the int parameter and creates an empty Model.', [['go', 'ds', 'ctrl', 'getOne(1, model)', 'req'], ['data', 'id', '1']], '@PathVariable → "1" → 1');
      S(L('service.findById'), 'The controller delegates business work to the service (injected by Spring).', [['go', 'ctrl', 'svc', 'findById(1)', 'req'], ['go', 'svc', 'ctrl', 'Student Ravi', 'obj'], ['data', 's', 'Student{1, Ravi, 85}']]);
      S(L('model.addAttribute'), 'Put the student into the Model for the view.', [['data', 'model', 'student → Ravi']]);
      S(L('return "student"'), 'Return just a <b>name</b>. The controller doesn\'t know where the file lives.', [['go', 'ctrl', 'ds', '"student" + model', 'obj']]);
      S(null, 'The ViewResolver adds a prefix and suffix to find the real file.', [['go', 'ds', 'vr', 'resolve "student"', 'req'], ['go', 'vr', 'ds', '/WEB-INF/views/student.jsp', 'res']], 'prefix + name + suffix → /WEB-INF/views/ + student + .jsp');
      S(null, 'The view renders HTML using the model data.', [['go', 'ds', 'view', 'render(model)', 'obj'], ['log', '<h1>Ravi — 85 marks</h1>', '']]);
      S(null, 'HTML goes back to the browser.', [['go', 'view', 'browser', 'HTML', 'res'], ['log', 'HTTP/1.1 200 OK (text/html)', 'ok']]);
      S(null, '✅ DispatcherServlet → HandlerMapping → Controller → Service → ViewResolver → View → response.', [['end']]);
    }, { nodes: mvcNodes(false), edges: [['browser', 'ds'], ['ds', 'hm'], ['ds', 'ctrl'], ['ctrl', 'svc'], ['ds', 'vr'], ['ds', 'view'], ['view', 'browser']], h: 340 }),
    scenario('REST → JSON', `
@RestController
@RequestMapping("/api/students")
public class StudentApi {

    private final StudentService service;

    public StudentApi(StudentService service) {
        this.service = service;
    }

    @GetMapping("/{id}")
    public Student getOne(@PathVariable int id) {
        return service.findById(id);   // becomes JSON
    }
}`, (L, S) => {
      S(null, 'A mobile app or React front-end calls the API.', [['go', 'browser', 'ds', 'GET /api/students/1', 'req'], ['log', 'GET /api/students/1  Accept: application/json', 'http']]);
      S(L('@RequestMapping'), 'Same routing as before.', [['go', 'ds', 'hm', '/api/students/1 ?', 'req'], ['go', 'hm', 'ds', 'StudentApi.getOne', 'res']]);
      S(L('@GetMapping'), 'Your method runs.', [['go', 'ds', 'ctrl', 'getOne(1)', 'req'], ['data', 'id', '1']]);
      S(L('return service.findById'), 'It returns a <b>Student object</b>, not a view name — because of <code>@RestController</code>.', [['go', 'ctrl', 'svc', 'findById(1)', 'req'], ['go', 'svc', 'ctrl', 'Student', 'obj'], ['go', 'ctrl', 'ds', 'Student object', 'obj']]);
      S(null, 'An <b>HttpMessageConverter</b> (Jackson) turns the object into JSON. No ViewResolver involved.', [['go', 'ds', 'conv', 'Student', 'obj'], ['go', 'conv', 'ds', '{ JSON }', 'res'], ['data', 'body', '{"id":1,"name":"Ravi","marks":85}']]);
      S(null, 'JSON goes back to the client.', [['go', 'ds', 'browser', '200 OK JSON', 'res'], ['log', '{"id":1,"name":"Ravi","marks":85}', 'ok']]);
      S(null, '✅ REST controllers return data; the client (React, Android…) decides how to show it.', [['end']]);
    }, { nodes: mvcNodes(true), edges: [['browser', 'ds'], ['ds', 'hm'], ['ds', 'ctrl'], ['ctrl', 'svc'], ['ds', 'conv']], h: 340 }),
  ] }),
  qa: [['Explain the Spring MVC request flow.', 'Request → DispatcherServlet → HandlerMapping finds the controller method → controller runs and returns a view name + model (or an object) → ViewResolver finds the view (or a message converter writes JSON) → response.'],
    ['What is DispatcherServlet?', 'The front controller servlet in Spring MVC. Every request goes through it and it delegates to handlers, view resolvers and converters.'],
    ['@Controller vs @RestController?', '@RestController = @Controller + @ResponseBody, so return values are written directly to the response body (usually JSON) instead of being treated as view names.'],
    ['@PathVariable vs @RequestParam?', '@PathVariable reads part of the URL path (/students/5). @RequestParam reads query parameters (?page=2).']],
  quiz: [
    { q: 'Which component receives every request first?', o: ['ViewResolver', 'DispatcherServlet', 'Your controller'], a: 1 },
    { q: 'In a @Controller, returning "student" means…', o: ['Send the text "student"', 'Use the view named student', 'An error'], a: 1 },
    { q: 'What turns a returned object into JSON?', o: ['ViewResolver', 'HttpMessageConverter (Jackson)', 'HandlerMapping'], a: 1 },
  ]
});

LESSONS.push({
  id: 'springjdbc', title: 'How Spring connects to JDBC', mins: 15, group: 'Spring',
  sum: 'Spring\'s JdbcTemplate keeps the power of SQL but removes the boilerplate: it opens and closes connections, handles exceptions and maps rows for you.',
  html: () => `
  <section class="blk"><h2>Three building blocks</h2><div class="g3">
    <div class="card"><h3>💧 DataSource</h3><p>Gives out database connections. In production it's a <b>connection pool</b> (HikariCP is Spring Boot's default) so connections are reused instead of opened every time.</p></div>
    <div class="card"><h3>🧰 JdbcTemplate</h3><p>Runs your SQL. Gets a connection, creates the statement, executes, closes everything, and converts <code>SQLException</code> into Spring's unchecked <code>DataAccessException</code>.</p></div>
    <div class="card"><h3>🔁 RowMapper</h3><p>A small function: "turn one row into one object". JdbcTemplate calls it for every row.</p></div></div></section>
  <section class="blk"><h2>Plain JDBC vs JdbcTemplate</h2><div class="stage"><div class="cmp"><div><b>Plain JDBC</b><div class="lc" id="sjA">16 lines</div><div id="sjCa"></div></div><div><b>JdbcTemplate</b><div class="lc" style="color:var(--green)">5 lines</div><div id="sjCb"></div></div></div><button class="btn orange" id="sjGo" style="margin-top:12px">✂️ Show what Spring handles for you</button></div></section>
  <section class="blk"><h2>▶ Watch JdbcTemplate run a query</h2><div data-run></div></section>
  <section class="blk"><h2>Other JdbcTemplate methods</h2>${C(`// insert / update / delete → returns rows affected
jdbc.update("INSERT INTO students(name, marks) VALUES (?, ?)", "Meera", 91);
jdbc.update("UPDATE students SET marks = ? WHERE id = ?", 95, 2);
jdbc.update("DELETE FROM students WHERE id = ?", 5);

// one value
Integer count = jdbc.queryForObject("SELECT COUNT(*) FROM students", Integer.class);

// one row → one object
Student s = jdbc.queryForObject("SELECT * FROM students WHERE id = ?", rowMapper, 1);`)}
  <div class="note tip"><span class="ic">🌱</span><div>In <b>Spring Boot</b> you don't even write the DataSource bean — just put the URL, username and password in <code>application.properties</code> and Boot creates the DataSource and JdbcTemplate for you.</div></div></section>`,
  mount(root) {
    $('#sjCa', root).innerHTML = C(`public List<Student> findAll() {
    List<Student> list = new ArrayList<>();
    try (Connection con = dataSource.getConnection();
         PreparedStatement ps = con.prepareStatement(SQL);
         ResultSet rs = ps.executeQuery()) {
        while (rs.next()) {
            list.add(new Student(rs.getInt("id"),
                                 rs.getString("name"),
                                 rs.getInt("marks")));
        }
    } catch (SQLException e) {
        throw new RuntimeException(e);
    }
    return list;
}`);
    $('#sjCb', root).innerHTML = C(`public List<Student> findAll() {
    return jdbc.query(SQL, (rs, n) -> new Student(rs.getInt("id"),
                                rs.getString("name"),
                                rs.getInt("marks")));
}`);
    $('#sjGo', root).onclick = async () => { const strike = [1, 2, 3, 4, 5, 9, 10, 11, 12, 13]; let n = 16; for (const l of $$('#sjCa .ln', root)) { if (!strike.includes(+l.dataset.i) || l.classList.contains('strike')) continue; l.classList.add('strike'); n--; $('#sjA', root).textContent = `${n} lines`; await sleep(130); } $('#sjA', root).innerHTML = '<span style="color:var(--green)">Spring handles every crossed-out line</span>'; const [x, y] = center($('#sjCb', root)); burst(x, y, 22); };
  },
  runner: () => ({ type: 'flow', scenarios: [scenario('jdbc.query()', `
@Configuration
public class DbConfig {
    @Bean
    public DataSource dataSource() {
        DriverManagerDataSource ds = new DriverManagerDataSource();
        ds.setUrl("jdbc:mysql://localhost:3306/college");
        ds.setUsername("root");
        ds.setPassword("pass");
        return ds;
    }
    @Bean
    public JdbcTemplate jdbcTemplate(DataSource ds) {
        return new JdbcTemplate(ds);
    }
}

@Repository
public class StudentDao {
    private final JdbcTemplate jdbc;
    public StudentDao(JdbcTemplate jdbc) { this.jdbc = jdbc; }

    public List<Student> findAll() {
        return jdbc.query("SELECT id, name, marks FROM students",
            (rs, rowNum) -> new Student(rs.getInt("id"),
                                        rs.getString("name"),
                                        rs.getInt("marks")));
    }
}`, (L, S) => {
    S(L('public DataSource dataSource()'), 'At startup Spring calls this <code>@Bean</code> method and keeps the DataSource as a bean. (DriverManagerDataSource is fine for learning; real apps use a pool like HikariCP.)', [['badge', 'ds', 'bean'], ['data', 'DataSource', 'jdbc:mysql://localhost:3306/college']]);
    S(L('public JdbcTemplate jdbcTemplate'), 'The JdbcTemplate bean needs a DataSource → Spring injects the one it just made.', [['link', 'ds', 'jt'], ['badge', 'jt', 'bean']]);
    S(L('public StudentDao(JdbcTemplate jdbc)'), 'StudentDao gets the JdbcTemplate by constructor injection.', [['link', 'jt', 'dao'], ['badge', 'dao', 'bean']]);
    S(L('public List<Student> findAll()'), 'Some service calls the DAO.', [['go', 'caller', 'dao', 'findAll()', 'req']]);
    S(L('return jdbc.query'), 'The DAO gives JdbcTemplate just two things: the SQL and a RowMapper.', [['go', 'dao', 'jt', 'query(sql, rowMapper)', 'req']]);
    S(L('return jdbc.query'), 'JdbcTemplate gets a connection from the DataSource — <b>you</b> never call getConnection.', [['go', 'jt', 'ds', 'getConnection()', 'req'], ['go', 'ds', 'jt', 'Connection', 'obj']]);
    S(L('"SELECT id, name, marks FROM students"'), 'It creates the statement and runs the SQL.', [['go', 'jt', 'db', 'SELECT id, name, marks …', 'sql'], ['log', 'SQL: SELECT id, name, marks FROM students', 'sql'], ['go', 'db', 'jt', '5 rows', 'res']]);
    S(L('(rs, rowNum) -> new Student'), 'For <b>each row</b>, JdbcTemplate calls your RowMapper lambda, which builds one Student.', [['go', 'jt', 'rm', 'row 0', 'obj'], ['go', 'rm', 'jt', 'Student Ravi', 'obj'], ['data', 'list', '[Ravi]']], 'rowNum 0 → new Student(1, "Ravi", 85)');
    S(L('(rs, rowNum) -> new Student'), '…and again for every remaining row.', [['go', 'jt', 'rm', 'rows 1–4', 'obj'], ['go', 'rm', 'jt', '4 Students', 'obj'], ['data', 'list', '[Ravi, Priya, Arjun, Sneha, Kiran]']], 'RowMapper called 5 times');
    S(L('rs.getInt("marks")));'), 'JdbcTemplate closes the ResultSet, statement and connection for you. Any SQLException would become an unchecked DataAccessException.', [['badge', 'ds', 'connection returned'], ['go', 'jt', 'dao', 'List<Student>', 'res'], ['go', 'dao', 'caller', '5 students', 'res'], ['log', '[Ravi, Priya, Arjun, Sneha, Kiran]', 'ok']]);
    S(null, '✅ Same JDBC underneath — Spring just does the repetitive parts.', [['end']]);
  }, { nodes: [{ id: 'caller', label: 'StudentService', icon: '⚙️', x: 8, y: 50 }, { id: 'dao', label: 'StudentDao', icon: '🗃️', sub: '@Repository', x: 30, y: 50 }, { id: 'jt', label: 'JdbcTemplate', icon: '🧰', x: 54, y: 50 }, { id: 'ds', label: 'DataSource', icon: '💧', sub: 'gives connections', x: 54, y: 13 }, { id: 'rm', label: 'RowMapper', icon: '🔁', sub: 'row → Student', x: 54, y: 87 }, { id: 'db', label: 'MySQL', icon: '🗄️', x: 88, y: 50 }], edges: [['caller', 'dao'], ['dao', 'jt'], ['jt', 'ds'], ['jt', 'db'], ['jt', 'rm'], ['ds', 'db']], h: 340 })] }),
  qa: [['What is JdbcTemplate?', 'A Spring class that simplifies JDBC: it manages connections, statements, result sets and exceptions so you only write SQL and row mapping.'],
    ['What is a DataSource?', 'An object that provides database connections, usually a connection pool such as HikariCP.'],
    ['What is a RowMapper?', 'A callback that converts one ResultSet row into one Java object; JdbcTemplate calls it for each row.'],
    ['What exception does Spring JDBC throw?', 'DataAccessException (unchecked), which wraps the checked SQLException with a more meaningful hierarchy.']],
  quiz: [
    { q: 'Who closes the connection when you use JdbcTemplate?', o: ['You', 'JdbcTemplate', 'Nobody'], a: 1 },
    { q: 'What does a RowMapper do?', o: ['Writes SQL', 'Converts a row into an object', 'Opens a connection'], a: 1 },
    { q: 'Spring Boot\'s default connection pool?', o: ['HikariCP', 'DriverManager', 'Tomcat threads'], a: 0 },
  ]
});

LESSONS.push({
  id: 'arch', title: 'Spring architecture & folders', mins: 15, group: 'Spring',
  sum: 'How the Spring framework is built from modules, and how a real Spring project is organised into layers and folders.',
  html: () => `
  <section class="blk"><h2>Spring framework modules</h2><p class="intro">Spring is not one big thing — it's a set of modules. You use only what you need. Watch them stack up.</p>
    <div class="stage"><div class="mods" id="mods"></div><button class="btn ghost" id="modGo" style="margin-top:12px">↺ Build again</button></div></section>
  <section class="blk"><h2>The layered architecture</h2><p class="intro">Every request travels down the layers and back up. Each layer only talks to the one below it.</p>

/* ---------------- 15. CRUD with Spring Boot + Hibernate ---------------- */
const CRUD_CTRL = `
@RestController
@RequestMapping("/api/students")
public class StudentController {

    private final StudentService service;

    public StudentController(StudentService service) {
        this.service = service;
    }

    @PostMapping
    public Student create(@RequestBody Student s) {
        return service.save(s);
    }

    @GetMapping("/{id}")
    public Student getOne(@PathVariable Long id) {
        return service.findById(id);
    }

    @PutMapping("/{id}")
    public Student update(@PathVariable Long id, @RequestBody Student s) {
        return service.update(id, s);
    }

    @DeleteMapping("/{id}")
    public void delete(@PathVariable Long id) {
        service.delete(id);

function decorate(root) {

function drawMap(d) {
  const svg = $('#mapSvg'), NS = 'http://www.w3.org/2000/svg';
  const per = 6, N = LESSONS.length, nrows = Math.ceil(N / per), rows = Array.from({ length: nrows }, (_, r) => [r * per, Math.min(N, (r + 1) * per), 60 + r * 150]);
  svg.setAttribute('viewBox', `0 0 1000 ${nrows * 150 + 10}`);
  const pts = [];
  rows.forEach(([a, b, y], r) => { for (let i = a; i < b; i++) { const k = i - a; const x = r % 2 === 0 ? 80 + k * 168 : 920 - k * 168; pts.push([x, y]); } });
  let dstr = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    if (y0 === y1) dstr += ` L${x1},${y1}`; else { const out = x0 > 500 ? 70 : -70; dstr += ` C${x0 + out},${y0} ${x1 + out},${y1} ${x1},${y1}`; }
  }
  const el = (t, a, p = svg) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };

  const L = base.getTotalLength();
  const stLen = pts.map(([x, y]) => { let best = 0, bd = 1e9; for (let s = 0; s <= L; s += 4) { const p = base.getPointAtLength(s); const dd = (p.x - x) ** 2 + (p.y - y) ** 2; if (dd < bd) { bd = dd; best = s; } } return best; });
  const doneCount = LESSONS.reduce((n, l, i) => d.has(l.id) ? Math.max(n, i + 1) : n, 0);
  const prog = el('path', { d: dstr, class: 'mp2' });
  const target = doneCount ? stLen[Math.min(doneCount, pts.length - 1)] : 0;
  prog.style.strokeDasharray = L; prog.style.strokeDashoffset = L;
  const shortT = ['Subqueries', 'Joins', 'Procedures', 'Views/Index', 'MVC', 'Servlets', 'JDBC', 'Hibernate', 'Spring IoC', 'Spring MVC', 'Spring JDBC', 'Architecture', 'Why Boot', 'Boot setup', 'CRUD', 'Finish'];
  pts.forEach(([x, y], i) => {
    const g = el('g', { class: 'ms' + (d.has(LESSONS[i].id) ? ' done' : ''), tabindex: 0, role: 'button', 'aria-label': `Lesson ${i + 1}: ${LESSONS[i].title}` });
    el('circle', { cx: x, cy: y, r: 22 }, g);
    const n = el('text', { x, y, class: 'n' }, g); n.textContent = d.has(LESSONS[i].id) ? '✓' : i + 1;
    const t = el('text', { x, y: y + 46, class: 't' }, g); t.textContent = shortT[i];
    g.onclick = () => go(i); g.onkeydown = e => { if (e.key === 'Enter') go(i); };
  });
  const cup = el('text', { x: 0, y: 0, 'font-size': 34, 'text-anchor': 'middle', 'dominant-baseline': 'central' }); cup.textContent = '🌱';
  const place = s => { const p = base.getPointAtLength(s); cup.setAttribute('transform', `translate(${p.x},${p.y - 38})`); };
  place(0);
  if (RM) { prog.style.strokeDashoffset = L - target; place(target); return; }
  const t0 = performance.now(), dur = 900 + target * 1.2;
  (function f(t) { if (!svg.isConnected) return; const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); const s = target * e; prog.style.strokeDashoffset = L - s; place(s); if (p < 1) requestAnimationFrame(f); })(t0);
}
function startRain() {

function confetti(count = 160) {
  if (RM) return;
  const c = $('#confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#E26B00', '#2A6FB0', '#1F8A55', '#E9A100', '#6A4FD8', '#D23B4A'];
  const ps = Array.from({ length: count }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 240, y: innerHeight / 3, vx: (Math.random() - .5) * 15, vy: Math.random() * -13 - 4, s: Math.random() * 8 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); });
    if (++f < 170) requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}
